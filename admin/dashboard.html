<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f5f5f7;
      color: #1d1d1f;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 30px;

      background: rgba(255,255,255,.86);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid #ddd;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 42px;
      height: 42px;

      border-radius: 50%;
      object-fit: cover;
    }

    .brand strong {
      font-family: Georgia, serif;
      font-size: 19px;
    }

    .brand span {
      display: block;

      color: #777;

      font-size: 10px;
      letter-spacing: 2px;
    }

    .logout {
      border: 0;

      padding: 10px 16px;

      border-radius: 20px;

      background: #111;
      color: white;
    }

    .container {
      width: min(1200px, 92%);

      margin: 0 auto;

      padding: 45px 0 80px;
    }

    .welcome {
      margin-bottom: 35px;
    }

    .welcome small {
      color: #777;
      letter-spacing: 2px;
    }

    .welcome h1 {
      margin-top: 8px;

      font-family: Georgia, serif;

      font-size: clamp(32px, 5vw, 55px);

      font-weight: 500;
    }

    /* TABS */

    .tabs {
      display: flex;
      gap: 10px;

      margin-bottom: 30px;

      padding: 6px;

      background: #e9e9ec;

      border-radius: 16px;
    }

    .tab {
      flex: 1;

      border: 0;

      padding: 12px 15px;

      border-radius: 12px;

      background: transparent;

      color: #666;

      font-weight: 600;
    }

    .tab.active {
      background: white;
      color: #111;

      box-shadow:
        0 3px 12px rgba(0,0,0,.08);
    }

    /* STATS */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;

      margin-bottom: 40px;
    }

    .stat {
      padding: 25px;

      background: white;

      border: 1px solid #e5e5e5;

      border-radius: 20px;

      box-shadow:
        0 8px 25px rgba(0,0,0,.04);
    }

    .stat span {
      color: #777;
      font-size: 13px;
    }

    .stat strong {
      display: block;

      margin-top: 8px;

      font-size: 35px;
    }

    /* TOOLBAR */

    .toolbar {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 15px;

      margin-bottom: 20px;
    }

    .toolbar h2 {
      font-family: Georgia, serif;

      font-size: 30px;
      font-weight: 500;
    }

    .primary {
      border: 0;

      padding: 13px 20px;

      border-radius: 24px;

      background: #111;
      color: white;
    }

    .search {
      width: 100%;

      padding: 14px 17px;

      margin-bottom: 20px;

      border: 1px solid #ddd;

      border-radius: 14px;

      outline: none;

      background: white;
    }

    /* CONTENT LIST */

    .content-list {
      display: grid;
      gap: 14px;
    }

    .content-item {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 20px;

      background: white;

      border: 1px solid #e5e5e5;

      border-radius: 18px;
    }

    .content-info {
      min-width: 0;
      flex: 1;
    }

    .content-info h3 {
      margin-bottom: 6px;

      font-family: Georgia, serif;

      font-size: 22px;

      word-break: break-word;
    }

    .content-info p {
      color: #777;
      font-size: 13px;

      word-break: break-word;
    }

    .status {
      display: inline-block;

      margin-top: 9px;

      padding: 4px 9px;

      border-radius: 20px;

      font-size: 11px;
    }

    .published {
      background: #e5f8e9;
      color: #19733a;
    }

    .draft {
      background: #eee;
      color: #666;
    }

    .actions {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;
    }

    .actions button {
      padding: 9px 13px;

      border: 0;

      border-radius: 10px;

      background: #eee;

      white-space: nowrap;
    }

    .actions .delete {
      background: #ffe8e8;
      color: #c00;
    }

    .chapter-button {
      background: #e8f0ff !important;
      color: #2457a6;
    }

    .empty {
      padding: 50px 20px;

      text-align: center;

      background: white;

      border-radius: 18px;

      color: #777;
    }

    .error-box {
      color: #b00020;
      background: #fff1f1;
      border: 1px solid #ffd4d4;
    }

    /* MODAL */

    .modal {
      position: fixed;

      inset: 0;

      z-index: 1000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.45);

      backdrop-filter: blur(8px);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: min(700px, 100%);

      max-height: 90vh;

      overflow-y: auto;

      padding: 30px;

      background: white;

      border-radius: 24px;
    }

    .modal-box h2 {
      margin-bottom: 25px;

      font-family: Georgia, serif;

      font-size: 30px;

      font-weight: 500;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 600;
    }

    .field input,
    .field textarea {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 12px;

      outline: none;

      background: white;
    }

    .field textarea {
      min-height: 250px;

      resize: vertical;

      line-height: 1.8;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 20px;
    }

    .cancel {
      padding: 12px 18px;

      border: 0;

      border-radius: 12px;

      background: #eee;
    }

    .save {
      padding: 12px 20px;

      border: 0;

      border-radius: 12px;

      background: #111;

      color: white;
    }

    #message,
    #chapterMessage {
      margin-top: 15px;

      text-align: center;

      font-size: 13px;
    }

    /* CHAPTER */

    .chapter-header {
      margin-bottom: 20px;
    }

    .chapter-header p {
      color: #777;
      font-size: 14px;
    }

    .chapter-list {
      display: grid;
      gap: 12px;
    }

    .chapter-item {
      padding: 16px;

      background: #f7f7f8;

      border: 1px solid #e5e5e5;

      border-radius: 15px;
    }

    .chapter-item-top {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      gap: 15px;
    }

    .chapter-title {
      font-weight: 600;

      font-size: 17px;
    }

    .chapter-number {
      color: #777;

      font-size: 12px;

      margin-bottom: 5px;
    }

    .chapter-actions {
      display: flex;

      gap: 7px;

      flex-wrap: wrap;
    }

    .chapter-actions button {
      padding: 7px 10px;

      border: 0;

      border-radius: 9px;

      background: #e8e8ea;

      font-size: 12px;
    }

    .chapter-actions .delete {
      background: #ffe8e8;

      color: #c00;
    }

    .chapter-divider {
      margin: 25px 0;

      border: 0;

      border-top: 1px solid #eee;
    }

    .chapter-form-title {
      margin-bottom: 18px;

      font-size: 20px;

      font-family: Georgia, serif;
    }

    @media (max-width: 700px) {

      .topbar {
        padding: 0 18px;
      }

      .container {
        width: 92%;

        padding-top: 30px;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab {
        min-width: 100px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .toolbar {
        align-items: flex-start;

        flex-direction: column;
      }

      .content-item {
        align-items: flex-start;

        flex-direction: column;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }

      .modal-box {
        padding: 22px;
      }

      .chapter-item-top {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="brand">

    <img
      src="../shadat-fatih.jpg"
      alt="Shadat Fatih"
    >

    <div>

      <strong>
        Shadat Fatih
      </strong>

      <span>
        ADMIN PANEL
      </span>

    </div>

  </div>


  <button
    class="logout"
    id="logoutBtn"
  >
    Logout
  </button>

</header>



<main class="container">


  <section class="welcome">

    <small>
      SHADAT FATIH
    </small>

    <h1>
      Dashboard
    </h1>

  </section>



  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      data-type="poems"
      type="button"
    >
      Poetry
    </button>


    <button
      class="tab"
      data-type="stories"
      type="button"
    >
      Stories
    </button>


    <button
      class="tab"
      data-type="novels"
      type="button"
    >
      Novels
    </button>

  </div>



  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <span>
        Total
      </span>

      <strong id="totalContent">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        Published
      </span>

      <strong id="publishedContent">
        0
      </strong>

    </div>


    <div class="stat">

      <span>
        Draft
      </span>

      <strong id="draftContent">
        0
      </strong>

    </div>

  </section>



  <!-- CONTENT -->

  <section>

    <div class="toolbar">

      <h2 id="sectionTitle">
        Poetry
      </h2>


      <button
        class="primary"
        id="addContentBtn"
        type="button"
      >
        + নতুন কবিতা
      </button>

    </div>


    <input
      class="search"
      id="search"
      type="search"
      placeholder="কবিতা খুঁজুন..."
    >


    <div
      class="content-list"
      id="contentList"
    ></div>

  </section>


</main>



<!-- CONTENT MODAL -->

<div
  class="modal"
  id="contentModal"
>

  <div class="modal-box">

    <h2 id="modalTitle">
      নতুন কবিতা
    </h2>


    <form id="contentForm">


      <div class="field">

        <label>
          নাম / Title
        </label>

        <input
          type="text"
          id="title"
          required
        >

      </div>


      <div class="field">

        <label>
          সংক্ষিপ্ত পরিচিতি
        </label>

        <input
          type="text"
          id="excerpt"
        >

      </div>


      <div class="field">

        <label>
          Cover Image URL
        </label>

        <input
          type="text"
          id="cover_url"
          placeholder="https://..."
        >

      </div>


      <div class="field">

        <label id="contentLabel">
          পুরো কবিতা
        </label>

        <textarea
          id="content"
          required
        ></textarea>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="cancel"
          id="cancelBtn"
        >
          Cancel
        </button>


        <button
          type="submit"
          class="save"
          id="saveBtn"
        >
          Save
        </button>

      </div>


      <div id="message"></div>

    </form>

  </div>

</div>



<!-- CHAPTER MODAL -->

<div
  class="modal"
  id="chapterModal"
>

  <div class="modal-box">

    <div class="chapter-header">

      <h2>
        Chapter Management
      </h2>

      <p id="chapterNovelName">
        উপন্যাস
      </p>

    </div>


    <!-- CHAPTER LIST -->

    <div
      class="chapter-list"
      id="chapterList"
    ></div>


    <hr class="chapter-divider">


    <!-- ADD CHAPTER -->

    <h3 class="chapter-form-title">
      নতুন Chapter
    </h3>


    <form id="chapterForm">


      <div class="field">

        <label>
          Chapter Number
        </label>

        <input
          type="number"
          id="chapterNumber"
          min="1"
          required
        >

      </div>


      <div class="field">

        <label>
          Chapter Title
        </label>

        <input
          type="text"
          id="chapterTitle"
          placeholder="যেমন: প্রথম অধ্যায়"
          required
        >

      </div>


      <div class="field">

        <label>
          Chapter Content
        </label>

        <textarea
          id="chapterContent"
          placeholder="এখানে Chapter-এর সম্পূর্ণ লেখা লিখুন..."
          required
        ></textarea>

      </div>


      <div class="modal-actions">

        <button
          type="button"
          class="cancel"
          id="chapterCancelBtn"
        >
          বন্ধ করুন
        </button>


        <button
          type="submit"
          class="save"
          id="chapterSaveBtn"
        >
          Chapter যোগ করুন
        </button>

      </div>


      <div id="chapterMessage"></div>

    </form>

  </div>

</div>



<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* ==========================================
   STATE
========================================== */

let currentType = "poems";

let contents = [];

let editingId = null;

let currentNovelId = null;



/* ==========================================
   TYPE SETTINGS
========================================== */

const typeSettings = {

  poems: {

    table: "poems",

    title: "Poetry",

    add: "+ নতুন কবিতা",

    search: "কবিতা খুঁজুন...",

    modal: "নতুন কবিতা",

    edit: "কবিতা সম্পাদনা",

    label: "পুরো কবিতা",

    empty: "এখনো কোনো কবিতা নেই।"

  },


  stories: {

    table: "stories",

    title: "Stories",

    add: "+ নতুন গল্প",

    search: "গল্প খুঁজুন...",

    modal: "নতুন গল্প",

    edit: "গল্প সম্পাদনা",

    label: "পুরো গল্প",

    empty: "এখনো কোনো গল্প নেই।"

  },


  novels: {

    table: "novels",

    title: "Novels",

    add: "+ নতুন উপন্যাস",

    search: "উপন্যাস খুঁজুন...",

    modal: "নতুন উপন্যাস",

    edit: "উপন্যাস সম্পাদনা",

    label: "উপন্যাসের মূল লেখা",

    empty: "এখনো কোনো উপন্যাস নেই।"

  }

};



/* ==========================================
   ELEMENTS
========================================== */

const contentList =
  document.getElementById(
    "contentList"
  );


const modal =
  document.getElementById(
    "contentModal"
  );


const form =
  document.getElementById(
    "contentForm"
  );


const message =
  document.getElementById(
    "message"
  );


const saveBtn =
  document.getElementById(
    "saveBtn"
  );


const chapterModal =
  document.getElementById(
    "chapterModal"
  );


const chapterList =
  document.getElementById(
    "chapterList"
  );


const chapterForm =
  document.getElementById(
    "chapterForm"
  );


const chapterMessage =
  document.getElementById(
    "chapterMessage"
  );



/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ==========================================
   CHECK LOGIN
========================================== */

async function checkUser() {

  try {

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if (error) {

      console.error(
        "Session error:",
        error
      );

      window.location.href =
        "./index.html";

      return false;
    }


    if (!data.session) {

      window.location.href =
        "./index.html";

      return false;
    }


    return true;

  }

  catch (error) {

    console.error(
      "Auth error:",
      error
    );

    window.location.href =
      "./index.html";

    return false;

  }

}



/* ==========================================
   LOAD CONTENT
========================================== */

async function loadContent() {

  const settings =
    typeSettings[currentType];


  contentList.innerHTML = `
    <div class="empty">
      Loading...
    </div>
  `;


  try {

    const {
      data,
      error
    } =
      await supabaseClient

        .from(settings.table)

        .select(
          "id,title,excerpt,cover_url,content,published,created_at"
        )

        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      throw error;

    }


    contents =
      Array.isArray(data)
        ? data
        : [];


    updateStats();

    renderContent();

  }

  catch (error) {

    console.error(
      "Load error:",
      error
    );


    contents = [];

    updateStats();


    contentList.innerHTML = `

      <div class="empty error-box">

        <strong>
          ${escapeHtml(settings.title)}
          load করা যায়নি।
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

      </div>

    `;

  }

}



/* ==========================================
   UPDATE STATS
========================================== */

function updateStats() {

  const published =
    contents.filter(
      item =>
        item.published === true
    ).length;


  document.getElementById(
    "totalContent"
  ).textContent =
    contents.length;


  document.getElementById(
    "publishedContent"
  ).textContent =
    published;


  document.getElementById(
    "draftContent"
  ).textContent =
    contents.length - published;

}



/* ==========================================
   RENDER CONTENT
========================================== */

function renderContent() {

  const settings =
    typeSettings[currentType];


  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    contents.filter(item => {

      const title =
        String(
          item.title || ""
        ).toLowerCase();


      const excerpt =
        String(
          item.excerpt || ""
        ).toLowerCase();


      return (
        title.includes(search) ||
        excerpt.includes(search)
      );

    });


  if (!filtered.length) {

    contentList.innerHTML = `

      <div class="empty">

        ${escapeHtml(
          settings.empty
        )}

      </div>

    `;

    return;

  }


  contentList.innerHTML =

    filtered.map(item => {

      const chapterButton =
        currentType === "novels"
          ? `
            <button
              type="button"
              class="chapter-button"
              onclick="manageChapters('${item.id}')"
            >
              Chapters
            </button>
          `
          : "";


      return `

        <article class="content-item">

          <div class="content-info">

            <h3>
              ${escapeHtml(
                item.title ||
                "Untitled"
              )}
            </h3>


            <p>
              ${escapeHtml(
                item.excerpt ||
                "No description"
              )}
            </p>


            <span
              class="status ${
                item.published
                  ? "published"
                  : "draft"
              }"
            >

              ${
                item.published
                  ? "Published"
                  : "Draft"
              }

            </span>

          </div>


          <div class="actions">

            <button
              type="button"
              onclick="editContent('${item.id}')"
            >
              Edit
            </button>


            ${chapterButton}


            <button
              type="button"
              onclick="togglePublish(
                '${item.id}',
                ${item.published === true}
              )"
            >

              ${
                item.published
                  ? "Unpublish"
                  : "Publish"
              }

            </button>


            <button
              type="button"
              class="delete"
              onclick="deleteContent('${item.id}')"
            >
              Delete
            </button>

          </div>

        </article>

      `;

    }).join("");

}



/* ==========================================
   ADD CONTENT
========================================== */

document
  .getElementById(
    "addContentBtn"
  )
  .addEventListener(
    "click",
    () => {

      editingId = null;


      const settings =
        typeSettings[currentType];


      document.getElementById(
        "modalTitle"
      ).textContent =
        settings.modal;


      document.getElementById(
        "contentLabel"
      ).textContent =
        settings.label;


      form.reset();


      message.textContent =
        "";


      saveBtn.textContent =
        "Save";


      modal.classList.add(
        "active"
      );

    }
  );



/* ==========================================
   EDIT CONTENT
========================================== */

window.editContent =
function(id) {

  const item =
    contents.find(
      content =>
        String(content.id) ===
        String(id)
    );


  if (!item) {

    alert(
      "Content পাওয়া যায়নি।"
    );

    return;

  }


  const settings =
    typeSettings[currentType];


  editingId = id;


  document.getElementById(
    "modalTitle"
  ).textContent =
    settings.edit;


  document.getElementById(
    "contentLabel"
  ).textContent =
    settings.label;


  document.getElementById(
    "title"
  ).value =
    item.title || "";


  document.getElementById(
    "excerpt"
  ).value =
    item.excerpt || "";


  document.getElementById(
    "cover_url"
  ).value =
    item.cover_url || "";


  document.getElementById(
    "content"
  ).value =
    item.content || "";


  message.textContent =
    "";


  saveBtn.textContent =
    "Update";


  modal.classList.add(
    "active"
  );

};



/* ==========================================
   SAVE / UPDATE CONTENT
========================================== */

form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    const settings =
      typeSettings[currentType];


    const title =
      document
        .getElementById("title")
        .value
        .trim();


    const excerpt =
      document
        .getElementById("excerpt")
        .value
        .trim();


    const cover_url =
      document
        .getElementById("cover_url")
        .value
        .trim();


    const content =
      document
        .getElementById("content")
        .value
        .trim();


    if (!title) {

      message.style.color =
        "#d00";

      message.textContent =
        "Title দিতে হবে।";

      return;

    }


    if (!content) {

      message.style.color =
        "#d00";

      message.textContent =
        `${settings.label} দিতে হবে।`;

      return;

    }


    saveBtn.disabled =
      true;


    saveBtn.style.opacity =
      ".6";


    message.style.color =
      "#777";


    message.textContent =
      "Saving...";


    const payload = {

      title,

      excerpt,

      cover_url,

      content

    };


    let result;


    if (editingId !== null) {

      result =
        await supabaseClient

          .from(settings.table)

          .update(payload)

          .eq(
            "id",
            editingId
          );

    }

    else {

      result =
        await supabaseClient

          .from(settings.table)

          .insert({

            ...payload,

            published: false

          });

    }


    saveBtn.disabled =
      false;


    saveBtn.style.opacity =
      "1";


    if (result.error) {

      console.error(
        "Save error:",
        result.error
      );


      message.style.color =
        "#d00";


      message.textContent =
        result.error.message;


      return;

    }


    message.style.color =
      "#16803c";


    message.textContent =
      editingId !== null
        ? "Updated successfully!"
        : "Saved successfully!";


    setTimeout(
      async () => {

        modal.classList.remove(
          "active"
        );


        editingId = null;


        form.reset();


        await loadContent();

      },
      500
    );

  }
);



/* ==========================================
   DELETE CONTENT
========================================== */

window.deleteContent =
async function(id) {

  const settings =
    typeSettings[currentType];


  const item =
    contents.find(
      content =>
        String(content.id) ===
        String(id)
    );


  const title =
    item?.title ||
    settings.title;


  const confirmed =
    confirm(
      `"${title}" মুছে ফেলতে চান?`
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await supabaseClient

      .from(settings.table)

      .delete()

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Delete error:",
      error
    );


    alert(
      error.message
    );

    return;

  }


  await loadContent();

};



/* ==========================================
   PUBLISH / UNPUBLISH CONTENT
========================================== */

window.togglePublish =
async function(
  id,
  current
) {

  const settings =
    typeSettings[currentType];


  const {
    error
  } =
    await supabaseClient

      .from(settings.table)

      .update({

        published:
          !current

      })

      .eq(
        "id",
        id
      );


  if (error) {

    console.error(
      "Publish error:",
      error
    );


    alert(
      error.message
    );

    return;

  }


  await loadContent();

};



/* ==========================================
   MANAGE CHAPTERS
========================================== */

window.manageChapters =
async function(novelId) {

  currentNovelId =
    Number(novelId);


  if (!currentNovelId) {

    alert(
      "Invalid Novel ID"
    );

    return;

  }


  const novel =
    contents.find(
      item =>
        Number(item.id) ===
        currentNovelId
    );


  document.getElementById(
    "chapterNovelName"
  ).textContent =
    novel
      ? `উপন্যাস: ${novel.title}`
      : "উপন্যাস";


  chapterMessage.textContent =
    "";


  chapterForm.reset();


  chapterModal.classList.add(
    "active"
  );


  await loadChapters();

};



/* ==========================================
   LOAD CHAPTERS
========================================== */

async function loadChapters() {

  chapterList.innerHTML = `

    <div class="empty">
      Chapter লোড হচ্ছে...
    </div>

  `;


  if (!currentNovelId) {

    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient

      .from("chapters")

      .select(
        "id,novel_id,chapter_number,title,content,published,created_at"
      )

      .eq(
        "novel_id",
        currentNovelId
      )

      .order(
        "chapter_number",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Chapter load error:",
      error
    );


    chapterList.innerHTML = `

      <div class="empty error-box">

        Chapter লোড করা যায়নি।

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

    return;

  }


  if (!data || data.length === 0) {

    chapterList.innerHTML = `

      <div class="empty">

        এই উপন্যাসে এখনো কোনো Chapter নেই।

      </div>

    `;

    return;

  }


  chapterList.innerHTML =

    data.map(chapter => `

      <div class="chapter-item">

        <div class="chapter-item-top">

          <div>

            <div class="chapter-number">

              Chapter
              ${escapeHtml(
                chapter.chapter_number
              )}

            </div>


            <div class="chapter-title">

              ${escapeHtml(
                chapter.title ||
                "Untitled Chapter"
              )}

            </div>


            <span
              class="status ${
                chapter.published
                  ? "published"
                  : "draft"
              }"
            >

              ${
                chapter.published
                  ? "Published"
                  : "Draft"
              }

            </span>

          </div>


          <div class="chapter-actions">

            <button
              type="button"
              onclick="toggleChapterPublish(
                ${chapter.id},
                ${chapter.published === true}
              )"
            >

              ${
                chapter.published
                  ? "Unpublish"
                  : "Publish"
              }

            </button>


            <button
              type="button"
              class="delete"
              onclick="deleteChapter(
                ${chapter.id}
              )"
            >
              Delete
            </button>

          </div>

        </div>

      </div>

    `).join("");

}



/* ==========================================
   ADD CHAPTER
========================================== */

chapterForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if (!currentNovelId) {

      chapterMessage.style.color =
        "#d00";

      chapterMessage.textContent =
        "কোনো Novel নির্বাচন করা হয়নি।";

      return;

    }


    const chapterNumber =
      Number(
        document
          .getElementById(
            "chapterNumber"
          )
          .value
      );


    const title =
      document
        .getElementById(
          "chapterTitle"
        )
        .value
        .trim();


    const content =
      document
        .getElementById(
          "chapterContent"
        )
        .value
        .trim();


    if (
      !chapterNumber ||
      chapterNumber < 1
    ) {

      chapterMessage.style.color =
        "#d00";

      chapterMessage.textContent =
        "সঠিক Chapter Number দিন।";

      return;

    }


    if (!title) {

      chapterMessage.style.color =
        "#d00";

      chapterMessage.textContent =
        "Chapter Title দিতে হবে।";

      return;

    }


    if (!content) {

      chapterMessage.style.color =
        "#d00";

      chapterMessage.textContent =
        "Chapter Content দিতে হবে।";

      return;

    }


    chapterMessage.style.color =
      "#777";


    chapterMessage.textContent =
      "Chapter যোগ হচ্ছে...";


    const {
      error
    } =
      await supabaseClient

        .from("chapters")

        .insert({

          novel_id:
            currentNovelId,

          chapter_number:
            chapterNumber,

          title:
            title,

          content:
            content,

          published:
            false

        });


    if (error) {

      console.error(
        "Chapter insert error:",
        error
      );


      chapterMessage.style.color =
        "#d00";


      chapterMessage.textContent =
        error.message;


      return;

    }


    chapterMessage.style.color =
      "#16803c";


    chapterMessage.textContent =
      "Chapter সফলভাবে যোগ হয়েছে।";


    chapterForm.reset();


    await loadChapters();

  }
);
