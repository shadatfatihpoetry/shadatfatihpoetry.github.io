<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — Admin</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #0b0b0b;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .login-box {
      width: min(400px, 90%);

      padding: 40px 30px;

      background: rgba(255,255,255,.07);

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 24px;

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      width: 60px;
      height: 60px;

      margin: 0 auto 20px;

      border-radius: 50%;

      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    h1 {
      text-align: center;

      font-family: Georgia, serif;

      font-size: 28px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #999;

      font-size: 13px;

      margin-bottom: 30px;
    }

    label {
      display: block;

      font-size: 13px;

      color: #aaa;

      margin-bottom: 8px;
    }

    input {
      width: 100%;

      padding: 14px 15px;

      margin-bottom: 18px;

      border: 1px solid rgba(255,255,255,.12);

      border-radius: 12px;

      background: rgba(255,255,255,.06);

      color: white;

      outline: none;

      font-size: 15px;
    }

    input:focus {
      border-color: rgba(255,255,255,.4);
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: white;

      color: #111;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      text-align: center;

      margin-top: 18px;

      font-size: 13px;

      color: #ff7777;
    }

  </style>

</head>


<body>

  <div class="login-box">

    <div class="logo">
      <img
        src="../shadat-fatih.jpg"
        alt="Shadat Fatih"
      >
    </div>

    <h1>
      Shadat Fatih
    </h1>

    <p class="subtitle">
      Poetry Admin Panel
    </p>


    <form id="loginForm">

      <label>
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Admin email"
        required
      >


      <label>
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >


      <button type="submit">
        Sign In
      </button>

    </form>


    <div id="message"></div>

  </div>


  <script>

    const form =
      document.getElementById("loginForm");

    form.addEventListener("submit", function(e) {

      e.preventDefault();

      document.getElementById("message").textContent =
        "Login system connecting...";

    });

  </script>

</body>

</html>
