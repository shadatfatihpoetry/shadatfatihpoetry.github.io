<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>উপন্যাস — Shadat Fatih</title>

  <meta
    name="description"
    content="Shadat Fatih-এর উপন্যাস"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    /* =====================================================
       NOVEL READING PAGE
    ===================================================== */

    .novel-reading-page {

      min-height: 100vh;

      padding:
        110px 20px 90px;

    }


    .novel-reading {

      width: 100%;

      max-width: 850px;

      margin: 0 auto;

    }


    /* =====================================================
       NOVEL HEADER
    ===================================================== */

    .novel-header {

      text-align: center;

      margin-bottom: 60px;

    }


    .novel-eyebrow {

      margin-bottom: 18px;

      font-family:
        "Playfair Display",
        serif;

      font-size: .8rem;

      letter-spacing: 4px;

      text-transform: uppercase;

      opacity: .55;

    }


    .novel-header h1 {

      margin: 0 0 25px;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(
          2.3rem,
          7vw,
          4.5rem
        );

      line-height: 1.3;

      font-weight: 600;

    }


    .novel-excerpt {

      max-width: 680px;

      margin: 0 auto;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.05rem;

      line-height: 2;

      opacity: .68;

    }


    /* =====================================================
       COVER IMAGE
    ===================================================== */

    .novel-cover {

      width: 100%;

      max-width: 500px;

      margin: 40px auto 0;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 20px 50px rgba(0,0,0,.12);

    }


    .novel-cover img {

      display: block;

      width: 100%;

      height: auto;

      max-height: 600px;

      object-fit: cover;

    }


    /* =====================================================
       DIVIDER
    ===================================================== */

    .novel-divider {

      width: 75px;

      height: 1px;

      margin: 45px auto 0;

      background: currentColor;

      opacity: .25;

    }


    /* =====================================================
       CHAPTER LIST
    ===================================================== */

    .novel-chapters {

      width: 100%;

    }


    /* =====================================================
       CHAPTER
    ===================================================== */

    .chapter {

      margin: 0 0 80px;

    }


    .chapter + .chapter {

      padding-top: 65px;

      border-top:
        1px solid rgba(0,0,0,.10);

    }


    /* =====================================================
       CHAPTER HEADER
    ===================================================== */

    .chapter-header {

      text-align: center;

      margin-bottom: 38px;

    }


    .chapter-number {

      display: block;

      margin-bottom: 12px;

      font-family:
        "Playfair Display",
        serif;

      font-size: .78rem;

      letter-spacing: 3px;

      text-transform: uppercase;

      opacity: .5;

    }


    .chapter-title {

      margin: 0;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(
          1.65rem,
          4vw,
          2.5rem
        );

      line-height: 1.5;

      font-weight: 600;

    }


    /* =====================================================
       CHAPTER CONTENT
    ===================================================== */

    .chapter-body {

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.15rem;

      line-height: 2.15;

      word-break: break-word;

    }


    .chapter-body p {

      margin:
        0 0 28px;

    }


    .chapter-body p:last-child {

      margin-bottom: 0;

    }


    /* =====================================================
       EMPTY CHAPTER
    ===================================================== */

    .no-chapters {

      padding: 65px 25px;

      text-align: center;

      border:
        1px solid rgba(0,0,0,.10);

      border-radius: 20px;

      background:
        rgba(255,255,255,.35);

    }


    .no-chapters h2 {

      margin: 0 0 12px;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.5rem;

      line-height: 1.6;

    }


    .no-chapters p {

      margin: 0;

      font-family:
        "Noto Serif Bengali",
        serif;

      line-height: 1.9;

      opacity: .6;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .novel-footer {

      margin-top: 90px;

      padding-top: 40px;

      text-align: center;

      border-top:
        1px solid rgba(0,0,0,.12);

    }


    .back-novels {

      display: inline-flex;

      align-items: center;

      gap: 8px;

      text-decoration: none;

    }


    /* =====================================================
       LOADING
    ===================================================== */

    .novel-loading {

      padding:
        110px 20px;

      text-align: center;

      font-family:
        "Noto Serif Bengali",
        serif;

    }


    .novel-loading p {

      opacity: .6;

    }


    /* =====================================================
       ERROR
    ===================================================== */

    .novel-error {

      padding:
        110px 20px;

      text-align: center;

      font-family:
        "Noto Serif Bengali",
        serif;

    }


    .novel-error h2 {

      margin-bottom: 15px;

      font-size: 1.8rem;

    }


    .novel-error p {

      margin: 0;

      line-height: 1.9;

      opacity: .65;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px) {

      .novel-reading-page {

        padding:
          75px 18px 65px;

      }


      .novel-header {

        margin-bottom: 45px;

      }


      .novel-header h1 {

        font-size: 2.25rem;

      }


      .novel-excerpt {

        font-size: 1rem;

      }


      .novel-cover {

        margin-top: 30px;

        border-radius: 14px;

      }


      .chapter {

        margin-bottom: 60px;

      }


      .chapter + .chapter {

        padding-top: 50px;

      }


      .chapter-body {

        font-size: 1.05rem;

        line-height: 2;

      }


      .chapter-title {

        font-size: 1.6rem;

      }


      .no-chapters {

        padding:
          50px 20px;

      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
===================================================== -->

<header class="navbar">

  <div class="nav-inner">


    <a
      href="index.html"
      class="brand-logo"
    >

      <img
        src="shadat-fatih.jpg"
        alt="Shadat Fatih"
      >

    </a>


    <a
      href="index.html"
      class="site-title"
    >
      Shadat Fatih
    </a>


    <a
      href="index.html#novels"
      class="text-link"
    >
      ← ফিরে যান
    </a>


  </div>

</header>



<!-- =====================================================
     NOVEL PAGE
===================================================== -->

<main>

  <section class="novel-reading-page">

    <div
      id="novel-container"
      class="novel-reading"
    >

      <div class="novel-loading">

        <p>
          উপন্যাস লোড হচ্ছে...
        </p>

      </div>

    </div>

  </section>

</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

  );


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   FORMAT CHAPTER CONTENT
===================================================== */

function formatContent(content) {

  if (!content) {

    return `
      <p>
        এই অধ্যায়ের লেখা এখনো যোগ করা হয়নি।
      </p>
    `;

  }


  const safeContent =
    escapeHtml(content);


  const paragraphs =
    safeContent
      .split(/\n\s*\n/);


  return paragraphs

    .map(paragraph => {

      const text =
        paragraph
          .replaceAll(
            "\n",
            "<br>"
          )
          .trim();


      if (!text) {

        return "";

      }


      return `
        <p>
          ${text}
        </p>
      `;

    })

    .join("");

}


/* =====================================================
   LOAD NOVEL
===================================================== */

async function loadNovel() {

  const container =
    document.getElementById(
      "novel-container"
    );


  /* -----------------------------------------------------
     GET ID FROM URL
  ----------------------------------------------------- */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  const novelId =
    Number(id);


  /* -----------------------------------------------------
     INVALID ID
  ----------------------------------------------------- */

  if (
    !id ||
    !Number.isInteger(novelId) ||
    novelId <= 0
  ) {

    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস পাওয়া যায়নি
        </h2>

        <p>
          সঠিক Novel ID পাওয়া যায়নি।
        </p>

      </div>

    `;

    return;

  }


  /* -----------------------------------------------------
     LOAD NOVEL
  ----------------------------------------------------- */

  const {
    data: novel,
    error: novelError
  } =

    await supabaseClient

      .from("novels")

      .select(
        "id,title,excerpt,cover_url,published"
      )

      .eq(
        "id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .single();


  /* -----------------------------------------------------
     NOVEL ERROR
  ----------------------------------------------------- */

  if (novelError) {

    console.error(
      "Novel loading error:",
      novelError
    );


    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস লোড করা যায়নি
        </h2>

        <p>
          ${escapeHtml(
            novelError.message
          )}
        </p>

      </div>

    `;

    return;

  }


  if (!novel) {

    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস পাওয়া যায়নি
        </h2>

      </div>

    `;

    return;

  }


  /* -----------------------------------------------------
     LOAD PUBLISHED CHAPTERS
  ----------------------------------------------------- */

  const {
    data: chapters,
    error: chapterError
  } =

    await supabaseClient

      .from("chapters")

      .select(
        "id,novel_id,chapter_number,title,content,published"
      )

      .eq(
        "novel_id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .order(
        "chapter_number",
        {
          ascending: true
        }
      );


  /* -----------------------------------------------------
     CHAPTER ERROR
  ----------------------------------------------------- */

  if (chapterError) {

    console.error(
      "Chapter loading error:",
      chapterError
    );


    container.innerHTML = `

      <div class="novel-error">

        <h2>
          Chapter লোড করা যায়নি
        </h2>

        <p>
          ${escapeHtml(
            chapterError.message
          )}
        </p>

      </div>

    `;

    return;

  }


  /* -----------------------------------------------------
     BUILD CHAPTER HTML
  ----------------------------------------------------- */

  let chapterHtml = "";


  if (
    Array.isArray(chapters) &&
    chapters.length > 0
  ) {

    chapterHtml =

      chapters
        .map(chapter => {

          return `

            <article
              class="chapter"
              id="chapter-${escapeHtml(
                chapter.id
              )}"
            >

              <header
                class="chapter-header"
              >

                <span
                  class="chapter-number"
                >

                  Chapter
                  ${escapeHtml(
                    chapter.chapter_number
                  )}

                </span>


                <h2
                  class="chapter-title"
                >

                  ${escapeHtml(
                    chapter.title ||
                    "অধ্যায়"
                  )}

                </h2>

              </header>


              <div
                class="chapter-body"
              >

                ${formatContent(
                  chapter.content
                )}

              </div>

            </article>

          `;

        })
        .join("");

  }


  else {

    chapterHtml = `

      <div class="no-chapters">

        <h2>
          এই উপন্যাসে এখনো কোনো
          প্রকাশিত Chapter নেই।
        </h2>

        <p>
          Chapter প্রকাশিত হলে
          এখানে পড়া যাবে।
        </p>

      </div>

    `;

  }


  /* -----------------------------------------------------
     COVER
  ----------------------------------------------------- */

  let coverHtml = "";


  if (novel.cover_url) {

    coverHtml = `

      <div class="novel-cover">

        <img
          src="${escapeHtml(
            novel.cover_url
          )}"
          alt="${escapeHtml(
            novel.title
          )}"
          loading="lazy"
          onerror="
            this.parentElement.style.display='none';
          "
        >

      </div>

    `;

  }


  /* -----------------------------------------------------
     DISPLAY
  ----------------------------------------------------- */

  container.innerHTML = `

    <article>


      <!-- NOVEL HEADER -->

      <header
        class="novel-header"
      >

        <p
          class="novel-eyebrow"
        >
          NOVEL
        </p>


        <h1>

          ${escapeHtml(
            novel.title
          )}

        </h1>


        ${
          novel.excerpt
            ? `

              <p
                class="novel-excerpt"
              >

                ${escapeHtml(
                  novel.excerpt
                )}

              </p>

            `
            : ""
        }


        ${coverHtml}


        <div
          class="novel-divider"
        ></div>

      </header>



      <!-- CHAPTERS -->

      <div
        class="novel-chapters"
      >

        ${chapterHtml}

      </div>



      <!-- FOOTER -->

      <footer
        class="novel-footer"
      >

        <a
          href="index.html#novels"
          class="hero-button"
        >

          ← সব উপন্যাস

        </a>

      </footer>


    </article>

  `;

}


/* =====================================================
   START
===================================================== */

loadNovel();

</script>


</body>

</html>
