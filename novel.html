<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>উপন্যাস — Shadat Fatih</title>

  <meta
    name="description"
    content="Shadat Fatih-এর উপন্যাস"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">


  <style>

    /* =========================
       NOVEL READING PAGE
    ========================= */

    .novel-reading-page {
      min-height: 100vh;
      padding: 100px 20px 80px;
    }


    .novel-reading {
      max-width: 850px;
      margin: 0 auto;
    }


    /* =========================
       NOVEL HEADER
    ========================= */

    .novel-header {
      text-align: center;
      margin-bottom: 60px;
    }


    .novel-header .eyebrow {
      margin-bottom: 18px;
    }


    .novel-header h1 {
      font-family: "Noto Serif Bengali", serif;

      font-size:
        clamp(2.2rem, 6vw, 4.5rem);

      line-height: 1.25;

      margin: 0 0 25px;
    }


    .novel-excerpt {
      max-width: 650px;

      margin: 0 auto;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.05rem;

      line-height: 2;

      opacity: .7;
    }


    .novel-divider {
      width: 70px;

      height: 1px;

      margin: 45px auto;

      background: currentColor;

      opacity: .3;
    }


    /* =========================
       CHAPTER
    ========================= */

    .chapter {
      margin-bottom: 80px;
    }


    .chapter-header {
      text-align: center;

      margin-bottom: 35px;

      padding-bottom: 25px;

      border-bottom:
        1px solid rgba(0,0,0,.10);
    }


    .chapter-number {
      display: block;

      margin-bottom: 10px;

      font-family:
        "Playfair Display",
        serif;

      font-size: .9rem;

      letter-spacing: 2px;

      text-transform: uppercase;

      opacity: .55;
    }


    .chapter-title {
      margin: 0;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(1.6rem, 4vw, 2.4rem);

      line-height: 1.5;
    }


    .chapter-body {
      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.15rem;

      line-height: 2.15;
    }


    .chapter-body p {
      margin: 0 0 28px;
    }


    /* =========================
       CHAPTER DIVIDER
    ========================= */

    .chapter + .chapter {
      padding-top: 60px;

      border-top:
        1px solid rgba(0,0,0,.10);
    }


    /* =========================
       EMPTY CHAPTER
    ========================= */

    .no-chapters {
      padding: 70px 20px;

      text-align: center;

      font-family:
        "Noto Serif Bengali",
        serif;

      border:
        1px solid rgba(0,0,0,.10);

      border-radius: 18px;
    }


    .no-chapters h2 {
      margin-bottom: 12px;

      font-size: 1.5rem;
    }


    .no-chapters p {
      opacity: .65;

      line-height: 1.8;
    }


    /* =========================
       FOOTER
    ========================= */

    .novel-footer {
      text-align: center;

      margin-top: 90px;

      padding-top: 40px;

      border-top:
        1px solid rgba(0,0,0,.12);
    }


    .back-novels {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      text-decoration: none;
    }


    /* =========================
       LOADING / ERROR
    ========================= */

    .novel-loading {
      text-align: center;

      padding: 100px 20px;

      font-family:
        "Noto Serif Bengali",
        serif;
    }


    .novel-error {
      text-align: center;

      padding: 100px 20px;

      font-family:
        "Noto Serif Bengali",
        serif;
    }


    .novel-error h2 {
      margin-bottom: 15px;
    }


    .novel-error p {
      opacity: .65;

      line-height: 1.8;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .novel-reading-page {
        padding:
          70px 18px 60px;
      }


      .novel-header {
        margin-bottom: 45px;
      }


      .novel-body,
      .chapter-body {
        font-size: 1.05rem;

        line-height: 2;
      }


      .chapter {
        margin-bottom: 60px;
      }


      .chapter + .chapter {
        padding-top: 45px;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header class="navbar">

  <div class="nav-inner">


    <a
      href="index.html"
      class="brand-logo"
    >

      <img
        src="shadat-fatih.jpg"
        alt="Shadat Fatih"
      >

    </a>


    <a
      href="index.html"
      class="site-title"
    >
      Shadat Fatih
    </a>


    <a
      href="index.html#novels"
      class="text-link"
    >
      ← ফিরে যান
    </a>


  </div>

</header>



<!-- =========================
     NOVEL
========================= -->

<main>

  <section class="novel-reading-page">

    <div
      id="novel-container"
      class="novel-reading"
    >

      <div class="novel-loading">

        <p>
          উপন্যাস লোড হচ্ছে...
        </p>

      </div>

    </div>

  </section>

</main>



<!-- =========================
     SUPABASE
========================= -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =========================
   FORMAT CONTENT
========================= */

function formatContent(content) {

  if (!content) {

    return "";

  }


  return escapeHtml(content)

    .split(/\n\s*\n/)

    .map(paragraph => {

      return `
        <p>
          ${paragraph.replaceAll(
            "\n",
            "<br>"
          )}
        </p>
      `;

    })

    .join("");

}



/* =========================
   LOAD NOVEL
========================= */

async function loadNovel() {

  const container =
    document.getElementById(
      "novel-container"
    );


  /* =========================
     GET NOVEL ID
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  const novelId =
    Number(id);


  if (
    !id ||
    !Number.isInteger(novelId)
  ) {

    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস পাওয়া যায়নি
        </h2>

        <p>
          সঠিক Novel ID পাওয়া যায়নি।
        </p>

      </div>

    `;

    return;

  }



  /* =========================
     LOAD NOVEL
  ========================= */

  const {
    data: novel,
    error: novelError
  } =

    await supabaseClient

      .from("novels")

      .select(
        "id,title,excerpt,cover_url,content,published"
      )

      .eq(
        "id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .single();



  /* =========================
     NOVEL ERROR
  ========================= */

  if (novelError) {

    console.error(
      "Novel Error:",
      novelError
    );


    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস লোড করা যায়নি
        </h2>

        <p>
          ${escapeHtml(
            novelError.message
          )}
        </p>

      </div>

    `;

    return;

  }



  if (!novel) {

    container.innerHTML = `

      <div class="novel-error">

        <h2>
          উপন্যাস পাওয়া যায়নি
        </h2>

      </div>

    `;

    return;

  }



  /* =========================
     LOAD CHAPTERS
  ========================= */

  const {
    data: chapters,
    error: chapterError
  } =

    await supabaseClient

      .from("chapters")

      .select(
        "id,novel_id,chapter_number,title,content,published,created_at"
      )

      .eq(
        "novel_id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .order(
        "chapter_number",
        {
          ascending: true
        }
      );



  /* =========================
     CHAPTER ERROR
  ========================= */

  if (chapterError) {

    console.error(
      "Chapter Error:",
      chapterError
    );


    container.innerHTML = `

      <div class="novel-error">

        <h2>
          Chapter লোড করা যায়নি
        </h2>

        <p>
          ${escapeHtml(
            chapterError.message
          )}
        </p>

      </div>

    `;

    return;

  }



  /* =========================
     CHAPTER CONTENT
  ========================= */

  let chapterContent = "";



  if (
    chapters &&
    chapters.length > 0
  ) {

    chapterContent =

      chapters.map(
        (chapter, index) => {

          return `

            <article
              class="chapter"
              id="chapter-${chapter.id}"
            >

              <header
                class="chapter-header"
              >

                <span
                  class="chapter-number"
                >
                  Chapter
                  ${escapeHtml(
                    chapter.chapter_number
                  )}
                </span>


                <h2
                  class="chapter-title"
                >
                  ${escapeHtml(
                    chapter.title
                  )}
                </h2>

              </header>


              <div
                class="chapter-body"
              >

                ${formatContent(
                  chapter.content
                )}

              </div>

            </article>

          `;

        }
      ).join("");

  }


  else {

    /* =========================
       OLD NOVEL CONTENT
    ========================= */

    if (novel.content) {

      chapterContent = `

        <article class="chapter">

          <header
            class="chapter-header"
          >

            <span
              class="chapter-number"
            >
              Novel
            </span>


            <h2
              class="chapter-title"
            >
              ${escapeHtml(
                novel.title
              )}
            </h2>

          </header>


          <div
            class="chapter-body"
          >

            ${formatContent(
              novel.content
            )}

          </div>

        </article>

      `;

    }

    else {

      chapterContent = `

        <div
          class="no-chapters"
        >

          <h2>
            এই উপন্যাসে এখনো কোনো
            প্রকাশিত Chapter নেই।
          </h2>

          <p>
            Chapter প্রকাশিত হলে
            এখানে পড়া যাবে।
          </p>

        </div>

      `;

    }

  }



  /* =========================
     DISPLAY
  ========================= */

  container.innerHTML = `

    <article>


      <header
        class="novel-header"
      >

        <p class="eyebrow">
          NOVEL
        </p>


        <h1>
          ${escapeHtml(
            novel.title
          )}
        </h1>


        ${
          novel.excerpt
            ? `

              <p
                class="novel-excerpt"
              >

                ${escapeHtml(
                  novel.excerpt
                )}

              </p>

            `
            : ""
        }


        <div
          class="novel-divider"
        ></div>


      </header>



      <div
        class="novel-chapters"
      >

        ${chapterContent}

      </div>



      <footer
        class="novel-footer"
      >

        <a
          href="index.html#novels"
          class="hero-button"
        >
          ← সব উপন্যাস
        </a>

      </footer>


    </article>

  `;

}



/* =========================
   START
========================= */

loadNovel();

</script>


</body>

</html>
