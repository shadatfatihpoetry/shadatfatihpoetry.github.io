<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — উপন্যাস</title>

  <meta
    name="description"
    content="Shadat Fatih-এর উপন্যাস"
  >

  <meta
    name="author"
    content="Shadat Fatih"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =====================================================
       NOVEL PAGE
    ===================================================== */

    .novel-page {

      min-height: 100vh;

      padding:
        80px 20px
        100px;

    }


    .novel-reader {

      max-width: 900px;

      margin: 0 auto;

      padding:
        60px 55px;

    }


    .novel-reader .eyebrow {

      margin-bottom: 18px;

      letter-spacing: 3px;

    }


    .novel-reader h1 {

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(36px, 6vw, 68px);

      line-height: 1.25;

      margin:
        0 0 20px;

    }


    /* =====================================================
       META
    ===================================================== */

    .novel-meta {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 15px;

      margin-bottom: 35px;

      font-size: 13px;

      opacity: .65;

    }


    .novel-excerpt {

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 19px;

      line-height: 1.9;

      opacity: .75;

      margin-bottom: 40px;

    }


    /* =====================================================
       NOVEL BODY
    ===================================================== */

    .novel-body {

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 19px;

      line-height: 2.15;

      word-break: break-word;

    }


    .novel-body p {

      margin:
        0 0 28px;

    }


    /* =====================================================
       PREMIUM ACTIONS
    ===================================================== */

    .novel-actions {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 50px;

      padding-top: 25px;

      border-top:
        1px solid
        rgba(127,127,127,.2);

    }


    .novel-action-btn {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      border:
        1px solid
        rgba(127,127,127,.25);

      background: transparent;

      padding:
        11px 16px;

      border-radius: 999px;

      cursor: pointer;

      font-family: inherit;

      font-size: 13px;

      transition:
        transform .2s ease,
        background .2s ease;

    }


    .novel-action-btn:hover {

      transform:
        translateY(-2px);

    }


    .premium-icon {

      font-size: 15px;

    }


    /* =====================================================
       BACK
    ===================================================== */

    .novel-back {

      display: inline-block;

      margin-top: 30px;

    }


    /* =====================================================
       COMMENTS
    ===================================================== */

    .novel-comments {

      max-width: 900px;

      margin:
        45px auto 0;

      padding:
        35px 55px 60px;

      border-top:
        1px solid
        rgba(127,127,127,.2);

    }


    .comments-title {

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 28px;

      margin-bottom: 25px;

    }


    .comment-form {

      display: grid;

      gap: 12px;

    }


    .comment-form input,
    .comment-form textarea {

      width: 100%;

      box-sizing: border-box;

      padding:
        13px 15px;

      border:
        1px solid
        rgba(127,127,127,.3);

      border-radius: 8px;

      background: transparent;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 15px;

      outline: none;

    }


    .comment-form textarea {

      min-height: 130px;

      resize: vertical;

    }


    .comment-submit {

      width: fit-content;

      border: none;

      border-radius: 999px;

      padding:
        12px 20px;

      cursor: pointer;

      font-family: inherit;

      font-weight: 600;

    }


    .comment-status {

      font-size: 14px;

      margin-top: 5px;

    }


    .comments-list {

      display: grid;

      gap: 15px;

      margin-top: 35px;

    }


    .comment-card {

      padding: 18px;

      border:
        1px solid
        rgba(127,127,127,.18);

      border-radius: 10px;

    }


    .comment-author {

      font-weight: 700;

      margin-bottom: 6px;

    }


    .comment-text {

      font-family:
        "Noto Serif Bengali",
        serif;

      line-height: 1.8;

    }


    .comment-date {

      font-size: 11px;

      opacity: .55;

      margin-top: 8px;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .novel-page {

        padding:
          35px 12px
          70px;

      }


      .novel-reader {

        padding:
          35px 20px;

      }


      .novel-reader h1 {

        font-size: 34px;

      }


      .novel-excerpt {

        font-size: 17px;

      }


      .novel-body {

        font-size: 17px;

        line-height: 2;

      }


      .novel-comments {

        padding:
          30px 20px 45px;

      }


      .novel-action-btn {

        padding:
          10px 13px;

      }

    }

  </style>

</head>


<body>


<main class="novel-page">


  <!-- =====================================================
       NOVEL READER
  ====================================================== -->

  <article
    class="novel-reader"
    id="novel-content"
  >

    <p>
      উপন্যাস লোড হচ্ছে...
    </p>

  </article>


  <!-- =====================================================
       COMMENTS
  ====================================================== -->

  <section
    class="novel-comments"
    id="comments"
  >

    <h2 class="comments-title">
      মন্তব্য
    </h2>


    <form
      class="comment-form"
      id="commentForm"
    >

      <input
        type="text"
        id="commentName"
        placeholder="আপনার নাম"
        maxlength="100"
        required
      >


      <input
        type="email"
        id="commentEmail"
        placeholder="আপনার ইমেইল"
        maxlength="150"
        required
      >


      <textarea
        id="commentText"
        placeholder="আপনার মন্তব্য লিখুন..."
        maxlength="1000"
        required
      ></textarea>


      <button
        type="submit"
        class="comment-submit"
      >
        মন্তব্য প্রকাশ করুন
      </button>


      <p
        class="comment-status"
        id="commentStatus"
      ></p>

    </form>


    <div
      class="comments-list"
      id="commentsList"
    ></div>

  </section>


</main>



<!-- =====================================================
     SUPABASE
====================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =====================================================
   GET NOVEL ID
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const novelId =
  params.get("id");



/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* =====================================================
   DATE
===================================================== */

function formatDate(dateValue) {

  if (!dateValue) {

    return "";

  }


  const date =
    new Date(dateValue);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =====================================================
   FORMAT NOVEL
===================================================== */

function formatNovel(text) {

  if (!text) {

    return "";

  }


  return escapeHtml(text)

    .split(
      /\r?\n\s*\r?\n/
    )

    .map(
      paragraph => {

        return `

          <p>
            ${paragraph.replace(
              /\r?\n/g,
              "<br>"
            )}
          </p>

        `;

      }
    )

    .join("");

}



/* =====================================================
   LOAD NOVEL
===================================================== */

async function loadNovel() {

  const container =
    document.getElementById(
      "novel-content"
    );


  if (!novelId) {

    container.innerHTML = `

      <p class="eyebrow">
        NOVEL
      </p>


      <h1>
        উপন্যাস পাওয়া যায়নি
      </h1>


      <p class="novel-excerpt">
        উপন্যাসটির কোনো ID পাওয়া যায়নি।
      </p>


      <a
        href="index.html#novels"
        class="text-link novel-back"
      >
        ← সব উপন্যাস
      </a>

    `;

    return;

  }


  try {

    /*
      এখানে views ব্যবহার করা হচ্ছে না।
      কারণ novels table-এ views column নেই।
    */

    const {
      data,
      error
    } =
      await supabaseClient

        .from("novels")

        .select(
          "id, title, content, excerpt, created_at, published"
        )

        .eq(
          "id",
          novelId
        )

        .eq(
          "published",
          true
        )

        .single();


    if (error) {

      throw error;

    }


    if (!data) {

      throw new Error(
        "Novel not found"
      );

    }


    document.title =
      `${data.title} — Shadat Fatih`;


    container.innerHTML = `

      <p class="eyebrow">
        NOVEL
      </p>


      <h1>
        ${escapeHtml(data.title)}
      </h1>


      <div class="novel-meta">

        <span>
          ${formatDate(data.created_at)}
        </span>

      </div>


      ${
        data.excerpt
          ? `

            <p class="novel-excerpt">
              ${escapeHtml(data.excerpt)}
            </p>

          `
          : ""
      }


      <div class="novel-body">

        ${formatNovel(data.content)}

      </div>


      <!-- PREMIUM ACTIONS -->

      <div class="novel-actions">


        <button
          type="button"
          class="novel-action-btn"
          onclick="shareNovel()"
        >

          <span class="premium-icon">
            ✦
          </span>

          শেয়ার

        </button>


        <button
          type="button"
          class="novel-action-btn"
          onclick="copyNovelLink()"
        >

          <span class="premium-icon">
            ⧉
          </span>

          কপি লিংক

        </button>


        <button
          type="button"
          class="novel-action-btn"
          onclick="scrollToComments()"
        >

          <span class="premium-icon">
            ◌
          </span>

          মন্তব্য

        </button>


      </div>


      <a
        href="index.html#novels"
        class="text-link novel-back"
      >
        ← সব উপন্যাস
      </a>

    `;


    loadComments();

  }


  catch (error) {

    console.error(
      "Novel Error:",
      error
    );


    container.innerHTML = `

      <p class="eyebrow">
        NOVEL
      </p>


      <h1>
        উপন্যাস পাওয়া যায়নি
      </h1>


      <p class="novel-excerpt">
        এই উপন্যাসটি বর্তমানে প্রকাশিত নয়
        অথবা পাওয়া যাচ্ছে না।
      </p>


      <a
        href="index.html#novels"
        class="text-link novel-back"
      >
        ← সব উপন্যাস
      </a>

    `;

  }

}



/* =====================================================
   SHARE
===================================================== */

async function shareNovel() {

  const url =
    window.location.href;


  const title =
    document.title;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          title,

        url:
          url

      });

    }

    catch (error) {

      /* User cancelled */

    }

    return;

  }


  copyNovelLink();

}



/* =====================================================
   COPY LINK
===================================================== */

async function copyNovelLink() {

  const url =
    window.location.href;


  try {

    await navigator.clipboard.writeText(
      url
    );


    showStatus(
      "লিংক কপি হয়েছে ✓"
    );

  }


  catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      url;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showStatus(
      "লিংক কপি হয়েছে ✓"
    );

  }

}



/* =====================================================
   COMMENT SCROLL
===================================================== */

function scrollToComments() {

  document
    .getElementById(
      "comments"
    )
    ?.scrollIntoView({
      behavior: "smooth"
    });


  setTimeout(() => {

    document
      .getElementById(
        "commentText"
      )
      ?.focus();

  }, 600);

}



/* =====================================================
   LOAD COMMENTS
===================================================== */

async function loadComments() {

  const list =
    document.getElementById(
      "commentsList"
    );


  if (
    !list ||
    !novelId
  ) {

    return;

  }


  /*
    IMPORTANT:

    comments.novel_id-এর type
    novels.id-এর type-এর
    সঙ্গে একই হতে হবে।
  */


  const {
    data,
    error
  } =
    await supabaseClient

      .from("comments")

      .select(
        "id, name, comment, created_at"
      )

      .eq(
        "novel_id",
        novelId
      )

      .eq(
        "approved",
        true
      )

      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(
      "Comments Error:",
      error
    );

    return;

  }


  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `

      <p>
        এখনো কোনো মন্তব্য নেই।
      </p>

    `;

    return;

  }


  list.innerHTML =
    data
      .map(
        comment => {

          return `

            <article
              class="comment-card"
            >

              <div
                class="comment-author"
              >
                ${escapeHtml(
                  comment.name
                )}
              </div>


              <div
                class="comment-text"
              >
                ${escapeHtml(
                  comment.comment
                )}
              </div>


              <div
                class="comment-date"
              >
                ${formatDate(
                  comment.created_at
                )}
              </div>

            </article>

          `;

        }
      )
      .join("");

}



/* =====================================================
   COMMENT SUBMIT
===================================================== */

document
  .getElementById(
    "commentForm"
  )
  ?.addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        document
          .getElementById(
            "commentName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "commentEmail"
          )
          .value
          .trim();


      const comment =
        document
          .getElementById(
            "commentText"
          )
          .value
          .trim();


      const status =
        document.getElementById(
          "commentStatus"
        );


      if (
        !name ||
        !email ||
        !comment
      ) {

        status.textContent =
          "সব তথ্য পূরণ করুন।";

        return;

      }


      status.textContent =
        "মন্তব্য পাঠানো হচ্ছে...";


      const {
        error
      } =
        await supabaseClient

          .from("comments")

          .insert({

            novel_id:
              novelId,

            name:
              name,

            email:
              email,

            comment:
              comment,

            approved:
              false

          });


      if (error) {

        console.error(
          "Comment Insert Error:",
          error
        );


        status.textContent =
          "মন্তব্য পাঠানো যায়নি।";

        return;

      }


      document
        .getElementById(
          "commentForm"
        )
        .reset();


      status.textContent =
        "মন্তব্য পাঠানো হয়েছে। অনুমোদনের পর এটি দেখা যাবে।";

    }
  );



/* =====================================================
   STATUS
===================================================== */

function showStatus(message) {

  const status =
    document.getElementById(
      "commentStatus"
    );


  if (!status) {

    return;

  }


  status.textContent =
    message;


  setTimeout(() => {

    status.textContent =
      "";

  }, 2500);

}



/* =====================================================
   START
===================================================== */

loadNovel();

</script>


</body>

</html>
