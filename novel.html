<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>উপন্যাস — Shadat Fatih</title>

  <meta
    name="description"
    content="Shadat Fatih-এর উপন্যাস"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">


  <style>

    /* =========================
       NOVEL PAGE
    ========================= */

    .novel-reading-page {
      min-height: 100vh;
      padding: 100px 20px 80px;
    }


    .novel-reading {
      max-width: 900px;
      margin: 0 auto;
    }


    /* =========================
       NOVEL COVER
    ========================= */

    .novel-cover {
      width: 100%;
      max-width: 420px;

      margin: 0 auto 45px;

      border-radius: 22px;

      overflow: hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.15);
    }


    .novel-cover img {
      display: block;

      width: 100%;

      height: auto;

      max-height: 560px;

      object-fit: cover;
    }


    /* =========================
       HEADER
    ========================= */

    .novel-header {
      text-align: center;

      margin-bottom: 45px;
    }


    .novel-header .eyebrow {
      margin-bottom: 18px;

      font-size: 12px;

      letter-spacing: 4px;

      opacity: .55;
    }


    .novel-header h1 {
      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(2.2rem, 6vw, 4.5rem);

      line-height: 1.25;

      margin: 0 0 22px;
    }


    .novel-excerpt {
      max-width: 680px;

      margin: 0 auto;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.05rem;

      line-height: 2;

      opacity: .7;
    }


    .novel-divider {
      width: 70px;

      height: 1px;

      margin: 40px auto 0;

      background: currentColor;

      opacity: .25;
    }


    /* =========================
       CHAPTER AREA
    ========================= */

    .chapter-section {
      margin-top: 50px;
    }


    .chapter-heading {
      text-align: center;

      margin-bottom: 25px;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.35rem;
    }


    .chapter-list {
      display: grid;

      gap: 10px;

      margin-bottom: 55px;
    }


    .chapter-item {
      display: flex;

      align-items: center;

      gap: 15px;

      width: 100%;

      padding: 15px 18px;

      border: 1px solid rgba(0,0,0,.10);

      border-radius: 14px;

      background: rgba(255,255,255,.55);

      cursor: pointer;

      text-align: left;

      transition:
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }


    .chapter-item:hover {
      transform: translateY(-2px);

      box-shadow:
        0 8px 25px rgba(0,0,0,.08);
    }


    .chapter-item.active {
      background: #111;

      color: #fff;

      border-color: #111;
    }


    .chapter-number {
      flex: 0 0 auto;

      width: 38px;
      height: 38px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(0,0,0,.07);

      font-size: 13px;

      font-weight: 600;
    }


    .chapter-item.active
    .chapter-number {
      background: rgba(255,255,255,.16);
    }


    .chapter-title {
      min-width: 0;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1rem;

      line-height: 1.5;

      word-break: break-word;
    }


    /* =========================
       CURRENT CHAPTER
    ========================= */

    .current-chapter {
      margin-top: 20px;
    }


    .current-chapter-header {
      text-align: center;

      margin-bottom: 40px;
    }


    .current-chapter-label {
      display: inline-block;

      margin-bottom: 12px;

      font-size: 11px;

      letter-spacing: 3px;

      opacity: .55;
    }


    .current-chapter-title {
      margin: 0;

      font-family:
        "Noto Serif Bengali",
        serif;

      font-size:
        clamp(1.8rem, 5vw, 3rem);

      line-height: 1.4;
    }


    /* =========================
       CHAPTER CONTENT
    ========================= */

    .novel-body {
      font-family:
        "Noto Serif Bengali",
        serif;

      font-size: 1.15rem;

      line-height: 2.25;

      text-align: left;
    }


    .novel-body p {
      margin: 0 0 28px;
    }


    /* =========================
       NAVIGATION
    ========================= */

    .chapter-navigation {
      display: flex;

      justify-content: space-between;

      gap: 15px;

      margin-top: 60px;

      padding-top: 30px;

      border-top:
        1px solid rgba(0,0,0,.12);
    }


    .chapter-nav-button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      min-width: 130px;

      padding: 12px 18px;

      border: 1px solid rgba(0,0,0,.12);

      border-radius: 25px;

      background: transparent;

      color: inherit;

      cursor: pointer;

      text-decoration: none;

      font-family:
        "Noto Serif Bengali",
        serif;
    }


    .chapter-nav-button:hover {
      background: rgba(0,0,0,.05);
    }


    .chapter-nav-button:disabled {
      opacity: .35;

      cursor: not-allowed;
    }


    /* =========================
       FOOTER
    ========================= */

    .novel-footer {
      text-align: center;

      margin-top: 80px;

      padding-top: 40px;

      border-top:
        1px solid rgba(0,0,0,.12);
    }


    .back-novels {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      text-decoration: none;
    }


    /* =========================
       LOADING
    ========================= */

    .novel-loading {
      text-align: center;

      padding: 100px 20px;

      font-family:
        "Noto Serif Bengali",
        serif;
    }


    .novel-error {
      text-align: center;

      padding: 100px 20px;

      font-family:
        "Noto Serif Bengali",
        serif;
    }


    .novel-error h2 {
      margin-bottom: 15px;
    }


    .novel-error p {
      opacity: .65;

      line-height: 1.8;
    }


    /* =========================
       EMPTY CHAPTER
    ========================= */

    .chapter-empty {
      padding: 40px 20px;

      text-align: center;

      border:
        1px solid rgba(0,0,0,.10);

      border-radius: 18px;

      font-family:
        "Noto Serif Bengali",
        serif;

      opacity: .7;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 600px) {

      .novel-reading-page {
        padding: 70px 18px 60px;
      }


      .novel-cover {
        margin-bottom: 35px;

        border-radius: 16px;
      }


      .novel-header {
        margin-bottom: 35px;
      }


      .novel-body {
        font-size: 1.05rem;

        line-height: 2.05;
      }


      .chapter-navigation {
        flex-direction: column;
      }


      .chapter-nav-button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<!-- =========================
     NAVIGATION
========================= -->

<header class="navbar">

  <div class="nav-inner">

    <a
      href="index.html"
      class="brand-logo"
    >

      <img
        src="shadat-fatih.jpg"
        alt="Shadat Fatih"
      >

    </a>


    <a
      href="index.html"
      class="site-title"
    >
      Shadat Fatih
    </a>


    <a
      href="index.html#novels"
      class="text-link"
    >
      ← ফিরে যান
    </a>

  </div>

</header>


<!-- =========================
     NOVEL
========================= -->

<main>

<section class="novel-reading-page">

  <div
    id="novel-container"
    class="novel-reading"
  >

    <div class="novel-loading">

      <p>
        উপন্যাস লোড হচ্ছে...
      </p>

    </div>

  </div>

</section>

</main>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   STATE
========================= */

let novel = null;

let chapters = [];

let currentChapterIndex = 0;


/* =========================
   ELEMENT
========================= */

const container =
  document.getElementById(
    "novel-container"
  );


/* =========================
   SECURITY
========================= */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================
   CONTENT FORMAT
========================= */

function formatContent(content) {

  if (!content) {

    return `
      <p>
        এই Chapter-এর লেখা এখনো প্রকাশিত হয়নি।
      </p>
    `;

  }


  return escapeHtml(content)

    .split(/\n\s*\n/)

    .map(paragraph => {

      return `
        <p>
          ${paragraph.replaceAll(
            "\n",
            "<br>"
          )}
        </p>
      `;

    })

    .join("");

}


/* =========================
   GET URL PARAMETERS
========================= */

function getParameters() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  const chapter =
    params.get("chapter");


  const novelId =
    Number(id);


  const chapterNumber =
    chapter
      ? Number(chapter)
      : null;


  return {

    id,

    novelId,

    chapterNumber

  };

}


/* =========================
   LOAD NOVEL
========================= */

async function loadNovel() {

  const {
    id,
    novelId,
    chapterNumber
  } =
    getParameters();


  /* INVALID NOVEL ID */

  if (
    !id ||
    !Number.isInteger(novelId) ||
    novelId < 1
  ) {

    showError(
      "উপন্যাস পাওয়া যায়নি",
      "সঠিক Novel ID পাওয়া যায়নি।"
    );

    return;

  }


  /* =========================
     LOAD NOVEL INFO
  ========================= */

  const {
    data: novelData,
    error: novelError
  } =
    await supabaseClient

      .from("novels")

      .select(
        "id,title,excerpt,cover_url,published,created_at"
      )

      .eq(
        "id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .single();


  if (novelError) {

    console.error(
      "Novel Error:",
      novelError
    );


    showError(
      "উপন্যাস লোড করা যায়নি",
      novelError.message
    );

    return;

  }


  if (!novelData) {

    showError(
      "উপন্যাস পাওয়া যায়নি",
      "এই উপন্যাসটি বর্তমানে প্রকাশিত নয়।"
    );

    return;

  }


  novel =
    novelData;


  /* =========================
     LOAD CHAPTERS
  ========================= */

  const {
    data: chapterData,
    error: chapterError
  } =
    await supabaseClient

      .from("chapters")

      .select(
        "id,novel_id,chapter_number,title,content,published,created_at"
      )

      .eq(
        "novel_id",
        novelId
      )

      .eq(
        "published",
        true
      )

      .order(
        "chapter_number",
        {
          ascending: true
        }
      );


  if (chapterError) {

    console.error(
      "Chapter Error:",
      chapterError
    );


    showError(
      "Chapter লোড করা যায়নি",
      chapterError.message
    );

    return;

  }


  chapters =
    Array.isArray(chapterData)
      ? chapterData
      : [];


  /* =========================
     NO CHAPTER
  ========================= */

  if (!chapters.length) {

    renderNovelWithoutChapters();

    return;

  }


  /* =========================
     SELECT CHAPTER
  ========================= */

  if (
    Number.isInteger(chapterNumber)
  ) {

    const requestedIndex =
      chapters.findIndex(
        chapter =>
          Number(
            chapter.chapter_number
          ) === chapterNumber
      );


    if (
      requestedIndex !== -1
    ) {

      currentChapterIndex =
        requestedIndex;

    }

  }


  renderNovel();

}


/* =========================
   RENDER NOVEL
========================= */

function renderNovel() {

  const currentChapter =
    chapters[
      currentChapterIndex
    ];


  if (!currentChapter) {

    return;

  }


  const cover =
    novel.cover_url
      ? `

        <div class="novel-cover">

          <img
            src="${escapeHtml(
              novel.cover_url
            )}"
            alt="${escapeHtml(
              novel.title
            )}"
            loading="eager"
          >

        </div>

      `
      : "";


  const chapterList =
    chapters.map(
      (chapter, index) => {

        const active =
          index ===
          currentChapterIndex;


        return `

          <button
            type="button"
            class="chapter-item ${
              active
                ? "active"
                : ""
            }"
            onclick="openChapter(${index})"
          >

            <span
              class="chapter-number"
            >
              ${chapter.chapter_number}
            </span>


            <span
              class="chapter-title"
            >
              ${escapeHtml(
                chapter.title ||
                "অধ্যায়"
              )}
            </span>

          </button>

        `;

      }
    ).join("");


  container.innerHTML = `

    <article>

      ${cover}


      <!-- NOVEL HEADER -->

      <header class="novel-header">

        <p class="eyebrow">
          NOVEL
        </p>


        <h1>
          ${escapeHtml(
            novel.title
          )}
        </h1>


        ${
          novel.excerpt
            ? `

              <p class="novel-excerpt">
                ${escapeHtml(
                  novel.excerpt
                )}
              </p>

            `
            : ""
        }


        <div class="novel-divider"></div>

      </header>


      <!-- CHAPTER LIST -->

      <section
        class="chapter-section"
      >

        <h2
          class="chapter-heading"
        >
          অধ্যায়সমূহ
        </h2>


        <div
          class="chapter-list"
        >

          ${chapterList}

        </div>

      </section>


      <!-- CURRENT CHAPTER -->

      <section
        class="current-chapter"
        id="current-chapter"
      >

        <header
          class="current-chapter-header"
        >

          <span
            class="current-chapter-label"
          >
            CHAPTER
            ${currentChapter.chapter_number}
          </span>


          <h2
            class="current-chapter-title"
          >
            ${escapeHtml(
              currentChapter.title ||
              "অধ্যায়"
            )}
          </h2>

        </header>


        <div
          class="novel-body"
        >

          ${formatContent(
            currentChapter.content
          )}

        </div>


        <!-- CHAPTER NAVIGATION -->

        <div
          class="chapter-navigation"
        >

          <button
            type="button"
            class="chapter-nav-button"
            onclick="previousChapter()"
            ${
              currentChapterIndex === 0
                ? "disabled"
                : ""
            }
          >
            ← আগের অধ্যায়
          </button>


          <button
            type="button"
            class="chapter-nav-button"
            onclick="nextChapter()"
            ${
              currentChapterIndex ===
              chapters.length - 1
                ? "disabled"
                : ""
            }
          >
            পরের অধ্যায় →
          </button>

        </div>

      </section>


      <!-- FOOTER -->

      <footer
        class="novel-footer"
      >

        <a
          href="index.html#novels"
          class="hero-button"
        >
          ← সব উপন্যাস
        </a>

      </footer>

    </article>

  `;


  updateUrl();


  document.title =
    currentChapter.title
      ? `${currentChapter.title} — ${novel.title} — Shadat Fatih`
      : `${novel.title} — Shadat Fatih`;

}


/* =========================
   NOVEL WITHOUT CHAPTER
========================= */

function renderNovelWithoutChapters() {

  const cover =
    novel.cover_url
      ? `

        <div class="novel-cover">

          <img
            src="${escapeHtml(
              novel.cover_url
            )}"
            alt="${escapeHtml(
              novel.title
            )}"
          >

        </div>

      `
      : "";


  container.innerHTML = `

    <article>

      ${cover}


      <header
        class="novel-header"
      >

        <p class="eyebrow">
          NOVEL
        </p>


        <h1>
          ${escapeHtml(
            novel.title
          )}
        </h1>


        ${
          novel.excerpt
            ? `

              <p class="novel-excerpt">
                ${escapeHtml(
                  novel.excerpt
                )}
              </p>

            `
            : ""
        }


        <div class="novel-divider"></div>

      </header>


      <div
        class="chapter-empty"
      >

        এই উপন্যাসে এখনো কোনো
        প্রকাশিত Chapter নেই।

      </div>


      <footer
        class="novel-footer"
      >

        <a
          href="index.html#novels"
          class="hero-button"
        >
          ← সব উপন্যাস
        </a>

      </footer>

    </article>

  `;

}


/* =========================
   OPEN CHAPTER
========================= */

window.openChapter =
function(index) {

  if (
    index < 0 ||
    index >= chapters.length
  ) {

    return;

  }


  currentChapterIndex =
    index;


  renderNovel();


  setTimeout(
    () => {

      const chapterElement =
        document.getElementById(
          "current-chapter"
        );


      if (
        chapterElement
      ) {

        chapterElement.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

      }

    },
    50
  );

};


/* =========================
   PREVIOUS
========================= */

window.previousChapter =
function() {

  if (
    currentChapterIndex <= 0
  ) {

    return;

  }


  openChapter(
    currentChapterIndex - 1
  );

};


/* =========================
   NEXT
========================= */

window.nextChapter =
function() {

  if (
    currentChapterIndex >=
    chapters.length - 1
  ) {

    return;

  }


  openChapter(
    currentChapterIndex + 1
  );

};


/* =========================
   UPDATE URL
========================= */

function updateUrl() {

  if (!novel) {

    return;

  }


  const chapter =
    chapters[
      currentChapterIndex
    ];


  if (!chapter) {

    return;

  }


  const url =
    new URL(
      window.location.href
    );


  url.searchParams.set(
    "id",
    novel.id
  );


  url.searchParams.set(
    "chapter",
    chapter.chapter_number
  );


  window.history.replaceState(
    {},
    "",
    url
  );

}


/* =========================
   ERROR
========================= */

function showError(
  title,
  message
) {

  container.innerHTML = `

    <div class="novel-error">

      <h2>
        ${escapeHtml(title)}
      </h2>


      <p>
        ${escapeHtml(message)}
      </p>


      <br>


      <a
        href="index.html#novels"
        class="hero-button"
      >
        ← সব উপন্যাস
      </a>

    </div>

  `;

}


/* =========================
   START
========================= */

loadNovel();

</script>


</body>

</html>
