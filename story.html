<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — গল্প</title>

  <meta
    name="description"
    content="Shadat Fatih-এর গল্প"
  >

  <meta
    name="author"
    content="Shadat Fatih"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- GOOGLE FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>


<!-- =====================================================
     STORY PAGE
===================================================== -->

<main class="poem-page">


  <article
    class="poem-reader"
    id="story-content"
  >

    <div class="reader-loading">

      <p>
        গল্প লোড হচ্ছে...
      </p>

    </div>

  </article>


</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(dateValue) {

  if (!dateValue) {

    return "";

  }


  const date =
    new Date(dateValue);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =====================================================
   STORY FORMAT
===================================================== */

function formatStory(text) {

  if (!text) {

    return "";

  }


  return escapeHtml(text)
    .replace(/\r?\n/g, "<br>");

}



/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  let toast =
    document.getElementById(
      "sf-toast"
    );


  if (!toast) {

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "sf-toast";

    toast.className =
      "sf-toast";

    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.sfToastTimer
  );


  window.sfToastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 2200);

}



/* =====================================================
   COPY LINK
===================================================== */

async function copyStoryLink() {

  const url =
    window.location.href;


  try {

    await navigator.clipboard.writeText(
      url
    );


    showToast(
      "গল্পের লিংক কপি হয়েছে"
    );

  } catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      url;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showToast(
      "গল্পের লিংক কপি হয়েছে"
    );

  }

}



/* =====================================================
   SHARE
===================================================== */

async function shareStory(
  title
) {

  const url =
    window.location.href;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          title,

        text:
          "Shadat Fatih-এর গল্প — " + title,

        url:
          url

      });

    } catch (error) {

      /* User cancelled share */

    }

    return;

  }


  await copyStoryLink();

}



/* =====================================================
   COMMENT
===================================================== */

function openComments() {

  const comments =
    document.getElementById(
      "comments"
    );


  if (comments) {

    comments.scrollIntoView({

      behavior: "smooth",

      block: "start"

    });


    setTimeout(() => {

      const input =
        comments.querySelector(
          "textarea, input"
        );


      if (input) {

        input.focus();

      }

    }, 500);


    return;

  }


  showToast(
    "কমেন্ট সেকশন শীঘ্রই আসছে"
  );

}



/* =====================================================
   LOAD STORY
===================================================== */

async function loadStory() {

  const container =
    document.getElementById(
      "story-content"
    );


  if (!container) {

    return;

  }


  /* ---------------------------------------------
     GET ID FROM URL
  --------------------------------------------- */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  /* ---------------------------------------------
     NO ID
  --------------------------------------------- */

  if (!id) {

    container.innerHTML = `

      <div class="reader-error">

        <p class="eyebrow">
          STORIES
        </p>

        <h1>
          গল্প পাওয়া যায়নি
        </h1>

        <p>
          গল্পটির কোনো ID পাওয়া যায়নি।
        </p>

        <a
          href="index.html#stories"
          class="text-link"
        >
          ← সব গল্প
        </a>

      </div>

    `;

    return;

  }



  /* ---------------------------------------------
     LOAD FROM SUPABASE
     
     IMPORTANT:
     views column ব্যবহার করা হচ্ছে না।
  --------------------------------------------- */

  const {
    data,
    error
  } =
    await supabaseClient

      .from("stories")

      .select(
        "id, title, content, excerpt, created_at, published"
      )

      .eq(
        "id",
        id
      )

      .eq(
        "published",
        true
      )

      .single();



  /* ---------------------------------------------
     ERROR
  --------------------------------------------- */

  if (
    error ||
    !data
  ) {

    console.error(
      "Story Error:",
      error
    );


    container.innerHTML = `

      <div class="reader-error">

        <p class="eyebrow">
          STORIES
        </p>

        <h1>
          গল্প পাওয়া যায়নি
        </h1>

        <p>
          এই গল্পটি বর্তমানে প্রকাশিত নয়
          অথবা পাওয়া যাচ্ছে না।
        </p>

        <a
          href="index.html#stories"
          class="text-link"
        >
          ← সব গল্প
        </a>

      </div>

    `;

    return;

  }



  /* ---------------------------------------------
     PAGE TITLE
  --------------------------------------------- */

  document.title =
    `${data.title} — Shadat Fatih`;



  /* ---------------------------------------------
     RENDER STORY
  --------------------------------------------- */

  container.innerHTML = `

    <!-- =========================================
         TOP
    ========================================== -->

    <div class="reader-top">

      <p class="eyebrow">
        STORIES
      </p>


      <div class="reader-actions">


        <!-- TOTAL VIEWS -->

        <button
          type="button"
          class="reader-action"
          aria-label="Total Views"
          title="Total Views"
        >

          <span class="action-icon">
            ◉
          </span>

          <span>
            Views
          </span>

        </button>



        <!-- COMMENT -->

        <button
          type="button"
          class="reader-action"
          onclick="openComments()"
          aria-label="Comment"
          title="Comment"
        >

          <span class="action-icon">
            ◌
          </span>

          <span>
            Comment
          </span>

        </button>



        <!-- SHARE -->

        <button
          type="button"
          class="reader-action"
          onclick='shareStory(${JSON.stringify(data.title)})'
          aria-label="Share"
          title="Share"
        >

          <span class="action-icon">
            ↗
          </span>

          <span>
            Share
          </span>

        </button>



        <!-- COPY LINK -->

        <button
          type="button"
          class="reader-action"
          onclick="copyStoryLink()"
          aria-label="Copy Link"
          title="Copy Link"
        >

          <span class="action-icon">
            ⛓
          </span>

          <span>
            Copy Link
          </span>

        </button>


      </div>

    </div>



    <!-- =========================================
         STORY HEADER
    ========================================== -->

    <header class="reader-header">

      <p class="reader-date">
        ${formatDate(data.created_at)}
      </p>


      <h1>
        ${escapeHtml(data.title)}
      </h1>


      ${
        data.excerpt
          ? `

            <p class="poem-excerpt">
              ${escapeHtml(data.excerpt)}
            </p>

          `
          : ""
      }

    </header>



    <!-- =========================================
         STORY BODY
    ========================================== -->

    <div class="poem-body">

      ${formatStory(data.content)}

    </div>



    <!-- =========================================
         AUTHOR
    ========================================== -->

    <div class="reader-author">

      <span>
        Written by
      </span>

      <strong>
        Shadat Fatih
      </strong>

    </div>



    <!-- =========================================
         BOTTOM ACTIONS
    ========================================== -->

    <div class="reader-bottom-actions">


      <!-- COMMENT -->

      <button
        type="button"
        class="premium-action"
        onclick="openComments()"
      >

        <span>
          ◌
        </span>

        Comment

      </button>



      <!-- SHARE -->

      <button
        type="button"
        class="premium-action"
        onclick='shareStory(${JSON.stringify(data.title)})'
      >

        <span>
          ↗
        </span>

        Share

      </button>



      <!-- COPY LINK -->

      <button
        type="button"
        class="premium-action"
        onclick="copyStoryLink()"
      >

        <span>
          ⛓
        </span>

        Copy Link

      </button>


    </div>



    <!-- =========================================
         COMMENTS
    ========================================== -->

    <section
      id="comments"
      class="comments-section"
    >

      <div class="comments-header">

        <p class="eyebrow">
          COMMENTS
        </p>


        <h2>
          আপনার মতামত
        </h2>


        <p>
          এই গল্প সম্পর্কে আপনার অনুভূতি
          লিখুন।
        </p>

      </div>



      <div class="comment-placeholder">

        <p>
          কমেন্ট সিস্টেম প্রস্তুত হচ্ছে।
        </p>


        <small>
          আপনার মন্তব্য এখানে সংযুক্ত হবে।
        </small>

      </div>


    </section>



    <!-- =========================================
         BACK
    ========================================== -->

    <div class="reader-footer">

      <a
        href="index.html#stories"
        class="text-link"
      >
        ← সব গল্প
      </a>

    </div>


  `;

}



/* =====================================================
   START
===================================================== */

loadStory();

</script>


</body>

</html>
