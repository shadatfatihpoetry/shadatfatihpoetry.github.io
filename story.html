<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — গল্প</title>

  <meta
    name="description"
    content="Shadat Fatih-এর গল্পসমূহ"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <main class="poem-page">


    <section
      class="stories-page"
      id="stories-container"
    >

      <p class="eyebrow">
        STORIES
      </p>

      <h1>
        গল্প
      </h1>

      <p>
        গল্প লোড হচ্ছে...
      </p>

    </section>


  </main>



  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



  <script>


    /* ==============================
       SUPABASE CONFIGURATION
    ============================== */


    const SUPABASE_URL =
      "https://ooxbtwxqumaixvrwsllg.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );



    /* ==============================
       LOAD STORIES
    ============================== */


    async function loadStories() {


      const container =
        document.getElementById(
          "stories-container"
        );


      try {


        const { data, error } =
          await supabaseClient

            .from("stories")

            .select(
              "id, title, excerpt, created_at, published"
            )

            .eq(
              "published",
              true
            )

            .order(
              "created_at",
              {
                ascending: false
              }
            );



        /* ==============================
           ERROR
        ============================== */


        if (error) {

          console.error(
            "Supabase Error:",
            error
          );


          container.innerHTML = `

            <p class="eyebrow">
              STORIES
            </p>

            <h1>
              গল্প
            </h1>

            <p>
              গল্প লোড করা যায়নি।
            </p>

            <p style="font-size: 14px; opacity: .7;">
              ${escapeHtml(error.message)}
            </p>

          `;

          return;

        }



        /* ==============================
           NO STORIES
        ============================== */


        if (
          !data ||
          data.length === 0
        ) {


          container.innerHTML = `

            <p class="eyebrow">
              STORIES
            </p>

            <h1>
              গল্প
            </h1>

            <p>
              বর্তমানে কোনো প্রকাশিত গল্প নেই।
            </p>

          `;


          return;

        }



        /* ==============================
           STORIES LIST
        ============================== */


        container.innerHTML = `

          <p class="eyebrow">
            STORIES
          </p>


          <h1>
            গল্প
          </h1>


          <div class="stories-list">


            ${data.map(
              story => {


                return `

                  <article
                    class="story-card"
                  >


                    <h2>
                      ${escapeHtml(
                        story.title
                      )}
                    </h2>



                    ${
                      story.excerpt

                        ? `

                          <p class="story-excerpt">

                            ${escapeHtml(
                              story.excerpt
                            )}

                          </p>

                        `

                        : ""

                    }



                    ${
                      story.created_at

                        ? `

                          <p class="story-date">

                            ${formatDate(
                              story.created_at
                            )}

                          </p>

                        `

                        : ""

                    }



                    <a
                      href="story.html?id=${encodeURIComponent(
                        story.id
                      )}"
                      class="text-link"
                    >

                      গল্পটি পড়ুন →

                    </a>


                  </article>

                `;

              }
            ).join("")}


          </div>

        `;


      }

      catch (error) {


        console.error(
          "Unexpected Error:",
          error
        );


        container.innerHTML = `

          <p class="eyebrow">
            STORIES
          </p>

          <h1>
            গল্প
          </h1>

          <p>
            গল্প লোড করতে সমস্যা হয়েছে।
          </p>

        `;

      }


    }



    /* ==============================
       DATE FORMAT
    ============================== */


    function formatDate(
      date
    ) {


      try {


        return new Date(
          date
        ).toLocaleDateString(
          "bn-BD",
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );


      }


      catch {

        return "";

      }


    }



    /* ==============================
       SECURITY
       HTML ESCAPE
    ============================== */


    function escapeHtml(
      value
    ) {


      return String(
        value || ""
      )

        .replaceAll(
          "&",
          "&amp;"
        )

        .replaceAll(
          "<",
          "&lt;"
        )

        .replaceAll(
          ">",
          "&gt;"
        )

        .replaceAll(
          '"',
          "&quot;"
        )

        .replaceAll(
          "'",
          "&#039;"
        );


    }



    /* ==============================
       START
    ============================== */


    loadStories();


  </script>


</body>

</html>
