<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadat Fatih — গল্প</title>
  <meta name="theme-color" content="#faf9f6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    #sf-toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #1d1d1f; color: #fff; padding: 12px 22px; border-radius: 980px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 13.5px;
      opacity: 0; pointer-events: none; transition: all 0.35s cubic-bezier(0.16,1,0.3,1); z-index: 9999;
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
    }
    #sf-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .poem-excerpt, .story-excerpt, .novel-excerpt {
      text-align: center; font-size: 16px; color: #6e6e73; margin: 12px auto 28px;
      max-width: 420px; line-height: 1.6; font-style: italic;
    }
    .reader-author {
      text-align: center; margin-top: 40px; font-size: 14px; color: #86868b;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .reader-author strong { color: #1d1d1f; }
    .story-page { min-height: 100vh; background: #faf9f6; }
    .story-reader { max-width: 680px; margin: 0 auto; padding: 100px 24px 80px; }
    
  </style>
</head>
<body>
<main class="story-page">
  <article class="story-reader" id="story-content">
    <p style="text-align:center;color:#86868b;padding:60px 0;">গল্প লোড হচ্ছে...</p>
  </article>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL = "https://gwpesizyfwuwazpczmtz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NQX9lVLLy85feejZaa1gaA_YhA2Mv4Z";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<script>
function escapeHtml(value) {

  return String(value || "")

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* =================================================
   STORY FORMAT
================================================= */

function formatStory(text) {

  return escapeHtml(text)

    .replace(
      /\r?\n/g,
      "<br>"
    );

}



/* =================================================
   DATE FORMAT
================================================= */

function formatDate(value) {

  if (!value) {

    return "";

  }


  const date =
    new Date(value);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =================================================
   TOAST
================================================= */

function showToast(message) {

  let toast =
    document.getElementById(
      "sf-toast"
    );


  if (!toast) {

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "sf-toast";

    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.sfToastTimer
  );


  window.sfToastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      2200
    );

}



/* =================================================
   COPY LINK
================================================= */

async function copyCurrentLink() {

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );


    showToast(
      "লিংক কপি হয়েছে"
    );

  }

  catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      window.location.href;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showToast(
      "লিংক কপি হয়েছে"
    );

  }

}



/* =================================================
   SHARE
================================================= */

async function shareCurrentPage(
  title
) {

  const url =
    window.location.href;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          title,

        text:
          title,

        url:
          url

      });

    }

    catch (error) {

      /* User cancelled */

    }

    return;

  }


  await copyCurrentLink();

}



/* =================================================
   COMMENT
================================================= */

function openComments() {

  const comments =
    document.getElementById(
      "comments"
    );


  if (comments) {

    comments.scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

  }

}



/* =================================================
   LOCAL VIEW COUNTER
=================================================

   stories.views column ব্যবহার করা হচ্ছে না।

   তাই Supabase-এর:

   "column stories.views does not exist"

   error হবে না।

================================================= */

function getViewKey(id) {

  return (
    "shadat_story_views_" +
    id
  );

}


function increaseView(id) {

  const key =
    getViewKey(id);


  let value =
    Number(
      localStorage.getItem(key) || 0
    );


  const sessionKey =
    key + "_counted";


  /*
    একই browser session-এ
    একই story বারবার refresh করলে
    নতুন view যোগ হবে না।
  */

  if (
    !sessionStorage.getItem(
      sessionKey
    )
  ) {

    value++;

    localStorage.setItem(
      key,
      value
    );

    sessionStorage.setItem(
      sessionKey,
      "1"
    );

  }


  return value;

}



/* =================================================
   LOAD STORY
================================================= */

async function loadStory() {

  const container =
    document.getElementById(
      "story-content"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  /* =================================================
     NO ID
  ================================================= */

  if (!id) {

    container.innerHTML = `

      <p class="eyebrow">
        STORIES
      </p>


      <h1>
        গল্প পাওয়া যায়নি
      </h1>


      <p class="poem-excerpt">
        গল্পটির কোনো ID পাওয়া যায়নি।
      </p>


      <a
        href="index.html#stories"
        class="text-link"
      >
        ← সব গল্প
      </a>

    `;

    return;

  }



  try {

    /* =================================================
       FETCH STORY
    ================================================= */

    const {
      data,
      error
    } =
      await supabaseClient

        .from("stories")

        .select(
          "id, title, content, excerpt, created_at, published"
        )

        .eq(
          "id",
          id
        )

        .eq(
          "published",
          true
        )

        .single();


    if (
      error ||
      !data
    ) {

      throw (
        error ||
        new Error(
          "Story not found"
        )
      );

    }



    /* =================================================
       VIEW
    ================================================= */

    const views =
      increaseView(
        data.id
      );



    /* =================================================
       RENDER
    ================================================= */

    container.innerHTML = `

      <!-- =========================================
           TOP RIGHT VIEW
      ========================================== -->

      <div class="reader-top">

        <div
          class="view-counter"
          title="Views"
        >

          <span class="view-icon">
            ◉
          </span>


          <span>
            ${views.toLocaleString("en-US")}
            Views
          </span>

        </div>

      </div>



      <!-- =========================================
           CATEGORY
      ========================================== -->

      <p class="eyebrow">
        STORIES
      </p>



      <!-- =========================================
           DATE
      ========================================== -->

      <div class="published-date">

        ${formatDate(
          data.created_at
        )}

      </div>



      <!-- =========================================
           TITLE
      ========================================== -->

      <h1>

        ${escapeHtml(
          data.title
        )}

      </h1>



      <!-- =========================================
           EXCERPT
      ========================================== -->

      ${
        data.excerpt

          ? `

            <p class="poem-excerpt">

              ${escapeHtml(
                data.excerpt
              )}

            </p>

          `

          : ""
      }



      <!-- =========================================
           STORY BODY
      ========================================== -->

      <div class="poem-body">

        ${formatStory(
          data.content
        )}

      </div>



      <!-- =========================================
           AUTHOR
      ========================================== -->

      <div class="reader-author">

        Written by

        <strong>
          Shadat Fatih
        </strong>

      </div>



      <!-- =========================================
           BOTTOM ACTIONS
           ONLY HERE
      ========================================== -->

      <div class="reader-actions">


        <!-- COMMENT -->

        <button
          type="button"
          class="reader-action"
          onclick="openComments()"
        >

          <span class="action-icon">
            ✦
          </span>

          <span>
            Comment
          </span>

        </button>



        <!-- SHARE -->

        <button
          type="button"
          class="reader-action"
          onclick='shareCurrentPage(${JSON.stringify(data.title)})'
        >

          <span class="action-icon">
            ↗
          </span>

          <span>
            Share
          </span>

        </button>



        <!-- COPY -->

        <button
          type="button"
          class="reader-action"
          onclick="copyCurrentLink()"
        >

          <span class="action-icon">
            ⛓
          </span>

          <span>
            Copy Link
          </span>

        </button>


      </div>





      <!-- =========================================
           BACK
      ========================================== -->

      <a
        href="index.html#stories"
        class="text-link"
      >

        ← সব গল্প

      </a>

    `;

  }

  catch (error) {

    console.error(
      "Story Error:",
      error
    );


    container.innerHTML = `

      <p class="eyebrow">
        STORIES
      </p>


      <h1>
        গল্প পাওয়া যায়নি
      </h1>


      <p class="poem-excerpt">

        এই গল্পটি বর্তমানে প্রকাশিত নয়
        অথবা পাওয়া যাচ্ছে না।

      </p>


      <a
        href="index.html#stories"
        class="text-link"
      >

        ← সব গল্প

      </a>

    `;

  }

}



/* =================================================
   START
================================================= */

loadStory();


</script>
</body>
</html>
