<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — কবিতা</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =================================================
       PREMIUM READER ACTIONS
    ================================================= */

    .reader-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 22px;
    }

    .view-counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      font-family: "Playfair Display", serif;
      font-size: 14px;
      letter-spacing: 1.5px;

      color: #8f7540;

      padding: 8px 14px;

      border: 1px solid rgba(143,117,64,.35);
      border-radius: 30px;

      background: rgba(255,255,255,.45);
    }

    .view-icon {
      font-size: 16px;
      line-height: 1;
    }


    /* =================================================
       BOTTOM ACTIONS
    ================================================= */

    .reader-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;

      margin-top: 35px;
      padding-top: 20px;

      border-top: 1px solid rgba(0,0,0,.10);
    }

    .reader-action {
      appearance: none;
      border: 0;
      background: transparent;

      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 9px 13px;

      color: #292929;

      font-family: "Noto Serif Bengali", serif;
      font-size: 14px;

      cursor: pointer;

      border: 1px solid rgba(0,0,0,.13);
      border-radius: 25px;

      transition:
        transform .2s ease,
        border-color .2s ease,
        color .2s ease,
        background .2s ease;
    }

    .reader-action:hover {
      transform: translateY(-2px);
      border-color: #9c8147;
      color: #9c8147;
      background: rgba(156,129,71,.05);
    }

    .action-icon {
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #9c8147;
    }


    /* =================================================
       AUTHOR
    ================================================= */

    .reader-author {
      margin-top: 28px;
      font-family: "Playfair Display", serif;
      font-size: 17px;
    }


    /* =================================================
       COMMENTS
    ================================================= */

    .comments-area {
      margin-top: 45px;
      padding-top: 25px;

      border-top: 1px solid rgba(0,0,0,.10);
    }

    .comments-heading {
      font-family: "Playfair Display", serif;
      letter-spacing: 3px;
      color: #9c8147;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .comment-box {
      padding: 22px 0;
    }

    .comment-box h2 {
      margin-bottom: 12px;
    }

    .comment-box p {
      line-height: 1.9;
    }

    .comment-notice {
      margin-top: 10px;
      opacity: .65;
      font-size: 14px;
    }


    /* =================================================
       TOAST
    ================================================= */

    #sf-toast {
      position: fixed;
      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(20px);

      padding: 11px 18px;

      background: #171717;
      color: #fff;

      border-radius: 30px;

      font-size: 14px;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;

      z-index: 9999;
    }

    #sf-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width: 600px) {

      .reader-top {
        margin-bottom: 18px;
      }

      .view-counter {
        font-size: 13px;
        padding: 7px 12px;
      }

      .reader-actions {
        gap: 7px;
      }

      .reader-action {
        padding: 8px 11px;
        font-size: 13px;
      }

    }

  </style>

</head>


<body>


<main class="poem-page">

  <article
    class="poem-reader"
    id="poem-content"
  >

    <p>
      কবিতা লোড হচ্ছে...
    </p>

  </article>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}



/* =================================================
   POEM FORMAT
================================================= */

function formatPoem(text) {

  return escapeHtml(text)
    .replace(/\r?\n/g, "<br>");

}



/* =================================================
   DATE
================================================= */

function formatDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =================================================
   TOAST
================================================= */

function showToast(message) {

  let toast =
    document.getElementById("sf-toast");

  if (!toast) {

    toast =
      document.createElement("div");

    toast.id = "sf-toast";

    document.body.appendChild(toast);

  }

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.sfToastTimer);

  window.sfToastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 2200);

}



/* =================================================
   COPY LINK
================================================= */

async function copyCurrentLink() {

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );

    showToast("লিংক কপি হয়েছে");

  } catch (error) {

    const textarea =
      document.createElement("textarea");

    textarea.value =
      window.location.href;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast("লিংক কপি হয়েছে");

  }

}



/* =================================================
   SHARE
================================================= */

async function shareCurrentPage(title) {

  const url =
    window.location.href;

  if (navigator.share) {

    try {

      await navigator.share({
        title: title,
        text: title,
        url: url
      });

    } catch (error) {

      /* User cancelled */

    }

    return;
  }

  await copyCurrentLink();

}



/* =================================================
   COMMENT
================================================= */

function openComments() {

  const comments =
    document.getElementById("comments");

  if (comments) {

    comments.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}



/* =================================================
   VIEW COUNTER
=================================================

   IMPORTANT:

   এখানে poems.views ব্যবহার করা হচ্ছে না।
   তাই "column poems.views does not exist"
   error হবে না।

   আপাতত browser-based counter রাখা হচ্ছে।
   পরে Supabase view counter যুক্ত করা যাবে।
================================================= */

function getLocalViewKey(id) {

  return "shadat_poem_views_" + id;

}


function getViewCount(id) {

  const key =
    getLocalViewKey(id);

  const value =
    Number(localStorage.getItem(key) || 0);

  return value;

}


function increaseView(id) {

  const key =
    getLocalViewKey(id);

  let value =
    Number(localStorage.getItem(key) || 0);

  /*
    একই browser-এ একই poem বারবার
    refresh করলে বারবার count হবে না।
  */

  const sessionKey =
    key + "_counted";

  if (
    !sessionStorage.getItem(sessionKey)
  ) {

    value++;

    localStorage.setItem(
      key,
      value
    );

    sessionStorage.setItem(
      sessionKey,
      "1"
    );

  }

  return value;

}



/* =================================================
   LOAD POEM
================================================= */

async function loadPoem() {

  const container =
    document.getElementById(
      "poem-content"
    );

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if (!id) {

    container.innerHTML = `

      <p class="eyebrow">
        POETRY
      </p>

      <h1>
        কবিতা পাওয়া যায়নি
      </h1>

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

    return;

  }



  try {

    const {
      data,
      error
    } =
      await supabaseClient

        .from("poems")

        .select(
          "id, title, content, excerpt, created_at, published"
        )

        .eq("id", id)

        .eq("published", true)

        .single();


    if (error || !data) {

      throw error ||
        new Error("Poem not found");

    }



    /* Increase view */

    const views =
      increaseView(data.id);



    /* =================================================
       RENDER
    ================================================= */

    container.innerHTML = `

      <!-- TOP VIEW ONLY -->

      <div class="reader-top">

        <div
          class="view-counter"
          title="Views"
        >

          <span class="view-icon">
            ◉
          </span>

          <span>
            ${views.toLocaleString("en-US")}
            Views
          </span>

        </div>

      </div>



      <!-- CATEGORY -->

      <p class="eyebrow">
        POETRY
      </p>



      <!-- DATE -->

      <div class="published-date">
        ${formatDate(data.created_at)}
      </div>



      <!-- TITLE -->

      <h1>
        ${escapeHtml(data.title)}
      </h1>



      <!-- EXCERPT -->

      ${
        data.excerpt
          ? `

            <p class="poem-excerpt">
              ${escapeHtml(data.excerpt)}
            </p>

          `
          : ""
      }



      <!-- POEM -->

      <div class="poem-body">

        ${formatPoem(data.content)}

      </div>



      <!-- AUTHOR -->

      <div class="reader-author">

        Written by
        <strong>
          Shadat Fatih
        </strong>

      </div>



      <!-- BOTTOM ACTIONS ONLY -->

      <div class="reader-actions">

        <button
          type="button"
          class="reader-action"
          onclick="openComments()"
        >

          <span class="action-icon">
            ✦
          </span>

          <span>
            Comment
          </span>

        </button>



        <button
          type="button"
          class="reader-action"
          onclick="shareCurrentPage(${JSON.stringify(data.title)})"
        >

          <span class="action-icon">
            ↗
          </span>

          <span>
            Share
          </span>

        </button>



        <button
          type="button"
          class="reader-action"
          onclick="copyCurrentLink()"
        >

          <span class="action-icon">
            ⛓
          </span>

          <span>
            Copy Link
          </span>

        </button>

      </div>



      <!-- COMMENTS -->

      <section
        class="comments-area"
        id="comments"
      >

        <div class="comments-heading">
          COMMENTS
        </div>


        <div class="comment-box">

          <h2>
            আপনার মতামত
          </h2>

          <p>
            এই কবিতা সম্পর্কে আপনার অনুভূতি লিখুন।
          </p>

          <p class="comment-notice">
            কমেন্ট সিস্টেম এখানে যুক্ত করা হবে।
          </p>

        </div>

      </section>



      <!-- BACK -->

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

  } catch (error) {

    console.error(
      "Poem Error:",
      error
    );


    container.innerHTML = `

      <p class="eyebrow">
        POETRY
      </p>

      <h1>
        কবিতা পাওয়া যায়নি
      </h1>

      <p class="poem-excerpt">
        এই কবিতাটি বর্তমানে প্রকাশিত নয়
        অথবা পাওয়া যাচ্ছে না।
      </p>

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

  }

}



/* =================================================
   START
================================================= */

loadPoem();

</script>


</body>

</html>
