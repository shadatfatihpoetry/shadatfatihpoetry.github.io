<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — কবিতা</title>

  <meta
    name="description"
    content="Shadat Fatih-এর কবিতা"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- GOOGLE FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>


<!-- =====================================================
     POEM PAGE
===================================================== -->

<main class="poem-page">


  <article
    class="poem-reader"
    id="poem-content"
  >

    <div class="reader-loading">

      <p>
        কবিতা লোড হচ্ছে...
      </p>

    </div>

  </article>


</main>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dNAV-kJ5rv_-BH6GhChYVg_1xbRUNdy";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );



/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}



/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(dateValue) {

  if (!dateValue) {

    return "";

  }


  const date =
    new Date(dateValue);


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }


  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =====================================================
   POEM FORMAT
===================================================== */

function formatPoem(text) {

  if (!text) {

    return "";

  }


  return escapeHtml(text)
    .replace(/\r?\n/g, "<br>");

}



/* =====================================================
   TOAST
===================================================== */

function showToast(message) {

  let toast =
    document.getElementById(
      "sf-toast"
    );


  if (!toast) {

    toast =
      document.createElement(
        "div"
      );

    toast.id =
      "sf-toast";

    toast.className =
      "sf-toast";

    document.body.appendChild(
      toast
    );

  }


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.sfToastTimer
  );


  window.sfToastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 2200);

}



/* =====================================================
   COPY LINK
===================================================== */

async function copyPoemLink() {

  const url =
    window.location.href;


  try {

    await navigator.clipboard.writeText(
      url
    );


    showToast(
      "কবিতার লিংক কপি হয়েছে"
    );

  } catch (error) {

    const textarea =
      document.createElement(
        "textarea"
      );


    textarea.value =
      url;


    document.body.appendChild(
      textarea
    );


    textarea.select();


    document.execCommand(
      "copy"
    );


    textarea.remove();


    showToast(
      "কবিতার লিংক কপি হয়েছে"
    );

  }

}



/* =====================================================
   SHARE
===================================================== */

async function sharePoem(
  title
) {

  const url =
    window.location.href;


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          title,

        text:
          "Shadat Fatih-এর কবিতা — " + title,

        url:
          url

      });

    } catch (error) {

      /* User cancelled */

    }

    return;

  }


  await copyPoemLink();

}



/* =====================================================
   COMMENT
===================================================== */

function openComments() {

  const comments =
    document.getElementById(
      "comments"
    );


  if (comments) {

    comments.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });


    setTimeout(() => {

      const input =
        comments.querySelector(
          "textarea, input"
        );


      if (input) {

        input.focus();

      }

    }, 500);


    return;

  }


  showToast(
    "কমেন্ট সেকশন শীঘ্রই আসছে"
  );

}



/* =====================================================
   LOAD POEM
===================================================== */

async function loadPoem() {

  const container =
    document.getElementById(
      "poem-content"
    );


  if (!container) {

    return;

  }


  /* ---------------------------------------------
     GET ID FROM URL
  --------------------------------------------- */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if (!id) {

    container.innerHTML = `

      <div class="reader-error">

        <p class="eyebrow">
          POETRY
        </p>

        <h1>
          কবিতা পাওয়া যায়নি
        </h1>

        <p>
          কবিতাটির কোনো ID পাওয়া যায়নি।
        </p>

        <a
          href="index.html#poetry"
          class="text-link"
        >
          ← সব কবিতা
        </a>

      </div>

    `;

    return;

  }



  /* ---------------------------------------------
     LOAD POEM
  --------------------------------------------- */

  let data = null;

  let error = null;


  /*
    প্রথমে views ছাড়া data নেওয়া হচ্ছে।
    কারণ poems টেবিলে views column নেই।
  */

  const result =
    await supabaseClient

      .from("poems")

      .select(
        "id, title, content, excerpt, created_at, published"
      )

      .eq(
        "id",
        id
      )

      .eq(
        "published",
        true
      )

      .single();


  data =
    result.data;

  error =
    result.error;



  /* ---------------------------------------------
     ERROR
  --------------------------------------------- */

  if (
    error ||
    !data
  ) {

    console.error(
      "Poem Error:",
      error
    );


    container.innerHTML = `

      <div class="reader-error">

        <p class="eyebrow">
          POETRY
        </p>

        <h1>
          কবিতা পাওয়া যায়নি
        </h1>

        <p>
          এই কবিতাটি বর্তমানে প্রকাশিত নয়
          অথবা পাওয়া যাচ্ছে না।
        </p>

        <a
          href="index.html#poetry"
          class="text-link"
        >
          ← সব কবিতা
        </a>

      </div>

    `;

    return;

  }



  /* ---------------------------------------------
     PAGE TITLE
  --------------------------------------------- */

  document.title =
    `${data.title} — Shadat Fatih`;



  /* ---------------------------------------------
     RENDER
  --------------------------------------------- */

  container.innerHTML = `

    <!-- =========================================
         TOP META
    ========================================== -->

    <div class="reader-top">

      <p class="eyebrow">
        POETRY
      </p>


      <div class="reader-actions">

        <!-- TOTAL VIEWS -->

        <button
          type="button"
          class="reader-action"
          aria-label="Total Views"
          title="Total Views"
        >

          <span class="action-icon">
            ◉
          </span>

          <span>
            Views
          </span>

        </button>


        <!-- COMMENT -->

        <button
          type="button"
          class="reader-action"
          onclick="openComments()"
          aria-label="Comment"
          title="Comment"
        >

          <span class="action-icon">
            ◌
          </span>

          <span>
            Comment
          </span>

        </button>


        <!-- SHARE -->

        <button
          type="button"
          class="reader-action"
          onclick='sharePoem(${JSON.stringify(data.title)})'
          aria-label="Share"
          title="Share"
        >

          <span class="action-icon">
            ↗
          </span>

          <span>
            Share
          </span>

        </button>


        <!-- COPY LINK -->

        <button
          type="button"
          class="reader-action"
          onclick="copyPoemLink()"
          aria-label="Copy Link"
          title="Copy Link"
        >

          <span class="action-icon">
            ⛓
          </span>

          <span>
            Copy Link
          </span>

        </button>

      </div>

    </div>



    <!-- =========================================
         TITLE
    ========================================== -->

    <header class="reader-header">

      <p class="reader-date">
        ${formatDate(data.created_at)}
      </p>


      <h1>
        ${escapeHtml(data.title)}
      </h1>


      ${
        data.excerpt
          ? `

            <p class="poem-excerpt">
              ${escapeHtml(data.excerpt)}
            </p>

          `
          : ""
      }

    </header>



    <!-- =========================================
         POEM BODY
    ========================================== -->

    <div class="poem-body">

      ${formatPoem(data.content)}

    </div>



    <!-- =========================================
         AUTHOR
    ========================================== -->

    <div class="reader-author">

      <span>
        Written by
      </span>

      <strong>
        Shadat Fatih
      </strong>

    </div>



    <!-- =========================================
         ACTION BAR
    ========================================== -->

    <div class="reader-bottom-actions">

      <button
        type="button"
        class="premium-action"
        onclick="openComments()"
      >

        <span>
          ◌
        </span>

        Comment

      </button>


      <button
        type="button"
        class="premium-action"
        onclick='sharePoem(${JSON.stringify(data.title)})'
      >

        <span>
          ↗
        </span>

        Share

      </button>


      <button
        type="button"
        class="premium-action"
        onclick="copyPoemLink()"
      >

        <span>
          ⛓
        </span>

        Copy Link

      </button>

    </div>



    <!-- =========================================
         COMMENTS
    ========================================== -->

    <section
      id="comments"
      class="comments-section"
    >

      <div class="comments-header">

        <p class="eyebrow">
          COMMENTS
        </p>

        <h2>
          আপনার মতামত
        </h2>

        <p>
          এই কবিতা সম্পর্কে আপনার অনুভূতি
          লিখুন।
        </p>

      </div>


      <div class="comment-placeholder">

        <p>
          কমেন্ট সিস্টেম প্রস্তুত হচ্ছে।
        </p>

        <small>
          আপনার মন্তব্য এখানে সংযুক্ত হবে।
        </small>

      </div>

    </section>



    <!-- =========================================
         BACK
    ========================================== -->

    <div class="reader-footer">

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    </div>

  `;

}



/* =====================================================
   START
===================================================== */

loadPoem();

</script>


</body>

</html>
