<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shadat Fatih — কবিতা</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =================================================
       PREMIUM READER ACTIONS
    ================================================= */

    .reader-top {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 22px;
    }

    .view-counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      font-family: "Playfair Display", serif;
      font-size: 14px;
      letter-spacing: 1.5px;

      color: #8f7540;

      padding: 8px 14px;

      border: 1px solid rgba(143,117,64,.35);
      border-radius: 30px;

      background: rgba(255,255,255,.45);
    }

    .view-icon {
      font-size: 16px;
      line-height: 1;
    }


    /* =================================================
   PREMIUM READER ACTIONS
================================================= */

.reader-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;

  margin-top: 38px;
  padding-top: 22px;

  border-top: 1px solid rgba(0,0,0,.10);
}


/* ACTION BUTTON */

.reader-action {

  position: relative;

  appearance: none;

  display: inline-flex;
  align-items: center;
  justify-content: center;

  gap: 9px;

  min-width: 48px;
  min-height: 44px;

  padding: 9px 15px;

  border: 1px solid rgba(0,0,0,.12);
  border-radius: 14px;

  background:
    rgba(255,255,255,.55);

  color: #292929;

  font-family:
    "Noto Serif Bengali",
    serif;

  font-size: 13px;

  cursor: pointer;

  overflow: hidden;

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  transition:
    transform .28s cubic-bezier(.22,.61,.36,1),
    border-color .28s ease,
    background .28s ease,
    box-shadow .28s ease,
    color .28s ease;
}


/* GOLD SHINE */

.reader-action::before {

  content: "";

  position: absolute;

  top: 0;
  left: -120%;

  width: 80%;
  height: 100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(176,138,69,.13),
      transparent
    );

  transform: skewX(-20deg);

  transition:
    left .6s ease;

}


/* HOVER */

.reader-action:hover {

  transform:
    translateY(-4px);

  border-color:
    rgba(176,138,69,.55);

  color:
    #9c8147;

  background:
    rgba(255,255,255,.85);

  box-shadow:
    0 10px 25px rgba(0,0,0,.08),
    0 0 0 3px rgba(176,138,69,.04);

}


.reader-action:hover::before {

  left: 130%;

}


/* CLICK */

.reader-action:active {

  transform:
    translateY(-1px)
    scale(.96);

}


/* =================================================
   PREMIUM ICON
================================================= */

.action-icon {

  position: relative;

  width: 23px;
  height: 23px;

  display: inline-flex;

  align-items: center;
  justify-content: center;

  flex-shrink: 0;

  color:
    #9c8147;

  font-family:
    Arial,
    sans-serif;

  font-size: 17px;

  line-height: 1;

  transition:
    transform .3s cubic-bezier(.22,.61,.36,1),
    color .3s ease;
}


/* ICON ANIMATION */

.reader-action:hover .action-icon {

  transform:
    scale(1.15)
    rotate(-4deg);

  color:
    #b08a45;

}


/* COMMENT ICON */

.reader-action:first-child:hover .action-icon {

  animation:
    commentFloat .65s ease;

}


/* SHARE ICON */

.reader-action:nth-child(2):hover .action-icon {

  animation:
    shareFly .65s ease;

}


/* COPY ICON */

.reader-action:nth-child(3):hover .action-icon {

  animation:
    copyPulse .65s ease;

}


/* =================================================
   ANIMATIONS
================================================= */

@keyframes commentFloat {

  0% {
    transform: translateY(0) scale(1);
  }

  45% {
    transform: translateY(-4px) scale(1.18);
  }

  100% {
    transform: translateY(0) scale(1);
  }

}


@keyframes shareFly {

  0% {
    transform: translate(0,0) rotate(0);
  }

  45% {
    transform: translate(4px,-4px) rotate(-8deg);
  }

  100% {
    transform: translate(0,0) rotate(0);
  }

}


@keyframes copyPulse {

  0% {
    transform: scale(1);
  }

  45% {
    transform: scale(1.22) rotate(5deg);
  }

  100% {
    transform: scale(1);
  }

}


/* TEXT */

.reader-action > span:last-child {

  position: relative;

  z-index: 2;

  transition:
    letter-spacing .25s ease;

}


.reader-action:hover > span:last-child {

  letter-spacing:
    .3px;

}


/* =================================================
   MOBILE
================================================= */

@media (max-width: 600px) {

  .reader-actions {

    gap: 8px;

    margin-top: 30px;
    padding-top: 18px;

  }

  .reader-action {

    min-height: 42px;

    padding:
      8px 12px;

    border-radius: 12px;

    font-size: 12px;

  }

  .action-icon {

    width: 21px;
    height: 21px;

    font-size: 16px;

  }

}


    /* =================================================
       AUTHOR
    ================================================= */

    .reader-author {
      margin-top: 28px;
      font-family: "Playfair Display", serif;
      font-size: 17px;
    }




    /* =================================================
       TOAST
    ================================================= */

    #sf-toast {
      position: fixed;
      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(20px);

      padding: 11px 18px;

      background: #171717;
      color: #fff;

      border-radius: 30px;

      font-size: 14px;

      opacity: 0;
      pointer-events: none;

      transition: .25s ease;

      z-index: 9999;
    }

    #sf-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }


    /* =================================================
       MOBILE
    ================================================= */

    @media (max-width: 600px) {

      .reader-top {
        margin-bottom: 18px;
      }

      .view-counter {
        font-size: 13px;
        padding: 7px 12px;
      }

      .reader-actions {
        gap: 7px;
      }

      .reader-action {
        padding: 8px 11px;
        font-size: 13px;
      }

    }

  </style>

</head>


<body>


<main class="poem-page">

  <article
    class="poem-reader"
    id="poem-content"
  >

    <p>
      কবিতা লোড হচ্ছে...
    </p>

  </article>

</main>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

const SUPABASE_URL =
  "https://ooxbtwxqumaixvrwsllg.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_XGyfD_KIkMj0v7FWeSXoXw_Z9E1Kpu0";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
</script>

<script>

/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value) {

  return String(value || "")

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}



/* =================================================
   POEM FORMAT
================================================= */

function formatPoem(text) {

  return escapeHtml(text)
    .replace(/\r?\n/g, "<br>");

}



/* =================================================
   DATE
================================================= */

function formatDate(value) {

  if (!value) return "";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "";
  }

  return date.toLocaleDateString(
    "bn-BD",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}



/* =================================================
   TOAST
================================================= */

function showToast(message) {

  let toast =
    document.getElementById("sf-toast");

  if (!toast) {

    toast =
      document.createElement("div");

    toast.id = "sf-toast";

    document.body.appendChild(toast);

  }

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(window.sfToastTimer);

  window.sfToastTimer =
    setTimeout(() => {

      toast.classList.remove("show");

    }, 2200);

}



/* =================================================
   COPY LINK
================================================= */

async function copyCurrentLink() {

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );

    showToast("লিংক কপি হয়েছে");

  } catch (error) {

    const textarea =
      document.createElement("textarea");

    textarea.value =
      window.location.href;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand("copy");

    textarea.remove();

    showToast("লিংক কপি হয়েছে");

  }

}



/* =================================================
   SHARE
================================================= */

async function shareCurrentPage(title) {

  const url =
    window.location.href;

  if (navigator.share) {

    try {

      await navigator.share({
        title: title,
        text: title,
        url: url
      });

    } catch (error) {

      /* User cancelled */

    }

    return;
  }

  await copyCurrentLink();

}



/* =================================================
   COMMENT
================================================= */

function openComments() {

  const comments =
    document.getElementById("comments");

  if (comments) {

    comments.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }

}



/* =================================================
   SUPABASE VIEW COUNTER
================================================= */

async function increaseView(id) {

  try {

    const { error } =
      await supabaseClient.rpc(
        "increment_poem_views",
        {
          poem_id: id
        }
      );


    if (error) {

      console.error(
        "Poem View Error:",
        error
      );

      return 0;

    }


    /* Get updated view count */

    const {
      data,
      error: fetchError
    } =
      await supabaseClient

        .from("poems")

        .select("views")

        .eq("id", id)

        .single();


    if (fetchError) {

      console.error(
        "View Fetch Error:",
        fetchError
      );

      return 0;

    }


    return Number(
      data?.views || 0
    );


  } catch (error) {

    console.error(
      "View Counter Error:",
      error
    );

    return 0;

  }

}


/* =================================================
   LOAD POEM
================================================= */

async function loadPoem() {

  const container =
    document.getElementById(
      "poem-content"
    );

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");


  if (!id) {

    container.innerHTML = `

      <p class="eyebrow">
        POETRY
      </p>

      <h1>
        কবিতা পাওয়া যায়নি
      </h1>

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

    return;

  }



  try {

    const {
      data,
      error
    } =
      await supabaseClient

        .from("poems")

        .select(
          "id, title, content, excerpt, created_at, published"
        )

        .eq("id", id)

        .eq("published", true)

        .single();


    if (error || !data) {

      throw error ||
        new Error("Poem not found");

    }



/* Increase Supabase view */

const views =
  await increaseView(data.id);



    /* =================================================
       RENDER
    ================================================= */

    container.innerHTML = `

      <!-- TOP VIEW ONLY -->

      <div class="reader-top">

        <div
          class="view-counter"
          title="Views"
        >

          <span class="view-icon">
            ◉
          </span>

          <span>
            ${views.toLocaleString("en-US")}
            Views
          </span>

        </div>

      </div>



      <!-- CATEGORY -->

      <p class="eyebrow">
        POETRY
      </p>



      <!-- DATE -->

      <div class="published-date">
        ${formatDate(data.created_at)}
      </div>



      <!-- TITLE -->

      <h1>
        ${escapeHtml(data.title)}
      </h1>



      <!-- EXCERPT -->

      ${
        data.excerpt
          ? `

            <p class="poem-excerpt">
              ${escapeHtml(data.excerpt)}
            </p>

          `
          : ""
      }



      <!-- POEM -->

      <div class="poem-body">

        ${formatPoem(data.content)}

      </div>



      <!-- AUTHOR -->

      <div class="reader-author">

        Written by
        <strong>
          Shadat Fatih
        </strong>

      </div>



      <!-- BOTTOM ACTIONS ONLY -->

      <div class="reader-actions">

        <button
          type="button"
          class="reader-action"
          onclick="openComments()"
        >

          <span class="action-icon">
            ✦
          </span>

          <span>
            Comment
          </span>

        </button>



        <button
          type="button"
          class="reader-action"
          onclick="shareCurrentPage(${JSON.stringify(data.title)})"
        >

          <span class="action-icon">
            ↗
          </span>

          <span>
            Share
          </span>

        </button>



        <button
          type="button"
          class="reader-action"
          onclick="copyCurrentLink()"
        >

          <span class="action-icon">
            ⛓
          </span>

          <span>
            Copy Link
          </span>

        </button>

      </div>




      <!-- BACK -->

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

  } catch (error) {

    console.error(
      "Poem Error:",
      error
    );


    container.innerHTML = `

      <p class="eyebrow">
        POETRY
      </p>

      <h1>
        কবিতা পাওয়া যায়নি
      </h1>

      <p class="poem-excerpt">
        এই কবিতাটি বর্তমানে প্রকাশিত নয়
        অথবা পাওয়া যাচ্ছে না।
      </p>

      <a
        href="index.html#poetry"
        class="text-link"
      >
        ← সব কবিতা
      </a>

    `;

  }

}



/* =================================================
   START
================================================= */

loadPoem();

</script>


</body>

</html>
